name: install

on:
  push:
  pull_request:

jobs:
  test:
    name: test ${{ matrix.py }} - ${{ matrix.os }} - ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        py:
          - "3.11"
          - "3.10"
        env:
          - pip
          - conda
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Conda
        if: matrix.env == 'conda'
        uses: conda-incubator/setup-miniconda@v2
        with:
          python-version: ${{ matrix.py }}
          miniconda-version: "latest"
          activate-environment: test-env
          auto-update-conda: true

      - name: Setup Python for pip
        if: matrix.env == 'pip'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.py }}

      - name: Install libomp (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libomp

      - name: Install OpenGL dev (Linux)
        # raylib (linked into pufferlib._C) depends on libGL at link time
        # via setup.py's `-lGL`. The default ubuntu-latest runner doesn't
        # ship libgl1-mesa-dev, so the linker fails with "cannot find -lGL".
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install build dependencies
        # pybind11 is in pyproject.toml's [build-system].requires, but
        # --no-build-isolation below means we have to install it ourselves
        # so setup.py's `import pybind11` resolves at metadata-prep time.
        run: pip install --upgrade "setuptools>=69.0.0" "packaging>=24.2" "numpy<2.0" wheel pybind11

      - name: Install PyTorch CPU
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install pufferlib
        run: pip install -e . --no-build-isolation
