name: Installation Test

on:
  pull_request:
    branches: [ main, '3.0' ]
  push:
    branches: [ main, '3.0' ]

jobs:
  test:
    name: ${{ matrix.py }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        py: ["3.13", "3.12", "3.11"]
        exclude:
          - os: macos-latest
            py: "3.13"
        include:
          - os: ubuntu-latest
            py: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          sudo rm -rf ~/.cache/pip /tmp/* /var/tmp/*

      - name: Install pufferlib (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -U pip "setuptools<81" wheel numpy
          # CPU-only torch. The CUDA stack is ~3 GB of wheels and no longer
          # fits the runner's disk quota; see the Install steps in ci.yml.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e . --no-build-isolation

      - name: Install pufferlib (macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install -U pip
          # Deliberately a plain install: macOS wheels are already CPU-only, so
          # this keeps the default PEP 517 build-isolation path under test.
          pip install -e .
