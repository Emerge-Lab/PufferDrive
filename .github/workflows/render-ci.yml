name: render-ci

on:
  pull_request:
    branches: [ main, 'emerge/**' ]
  push:
    branches: [ main, 'emerge/**' ]

jobs:
  test-render:
    name: test-render - ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          sudo rm -rf ~/.cache/pip /tmp/* /var/tmp/*

      - name: Install system dependencies for headless EGL rendering
        run: |
          sudo apt update
          sudo apt install -y ffmpeg build-essential libegl1 libgles2 libgl1-mesa-dri libglvnd0

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install pufferlib
        run: pip install -e . --no-cache-dir
        env:
          TMPDIR: ${{ runner.temp }}/build
          PIP_NO_CACHE_DIR: 1
          PUFFER_CPU: 1

      - name: Compile C extensions
        run: python setup.py build_ext --inplace --force
        env:
          PUFFER_CPU: 1

      - name: Run egl render smoke test
        run: |
          pip install pytest
          python -m pytest tests/test_drive_render.py -v
        timeout-minutes: 15
