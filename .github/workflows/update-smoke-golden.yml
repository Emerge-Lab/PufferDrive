name: Update Smoke Golden

# Regenerate the smoke goldens in the pinned image and commit them back; run it by hand or push a commit with
# [update-golden] in its message: git commit --allow-empty -m "regen smoke golden [update-golden]" && git push

on:
  workflow_dispatch:
  push:
    branches:
      - '3.0'
      - 'ev/**'

permissions:
  contents: write

jobs:
  update-golden:
    name: Regenerate smoke golden
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-golden]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Regenerate goldens
        run: tests/smoke_tests/update_goldens.sh
        timeout-minutes: 45

      - name: Upload golden artifact
        uses: actions/upload-artifact@v4
        with:
          name: drive_smoke_golden
          path: |
            tests/smoke_tests/data/drive_smoke_golden.json
            tests/smoke_tests/data/drive_rollout_golden.json

      - name: Commit regenerated goldens
        run: |
          GOLDENS="tests/smoke_tests/data/drive_smoke_golden.json tests/smoke_tests/data/drive_rollout_golden.json"
          # the container writes the goldens as root through the bind mount
          sudo chown "$(id -u):$(id -g)" $GOLDENS
          # json.dump writes no trailing newline, which pre-commit's end-of-file-fixer wants
          for f in $GOLDENS; do
            [ -n "$(tail -c1 "$f")" ] && printf '\n' >> "$f"
          done
          if git diff --quiet -- $GOLDENS; then
            echo "Goldens unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $GOLDENS  # data/ is gitignored; the files are tracked
          git commit -m "Regenerate smoke goldens"
          git push origin "HEAD:${{ github.ref_name }}"
