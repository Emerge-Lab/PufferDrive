# Registry of shared datasets in the lab S3 buckets (see docs/data_storage.md).
#
# Fetch with:  python data_utils/fetch_data.py <name>
#
# Fields:
#   s3_uri:      source prefix, synced recursively into $PUFFERDRIVE_DATA_ROOT/<name>/
#   description: what the data is and where it is in its lifecycle
#   license:     upstream license constraint — governs how copies may be shared
#   size:        approximate download size and file count, shown before syncing
#   public:      optional, true for public-read buckets — fetches without AWS
#                credentials (unsigned requests); omit for IAM-only buckets

# Default starting point: the ~10 GB mini splits. Fetch the full splits only
# when you need the complete scenario coverage.

nuplan_mini_train:
  s3_uri: s3://pufferdrive-bins/nuplan/0.3.2-mini/train/
  size: ~10 GB, ~3.6k bins
  description: >-
    10 GB sample of the nuPlan train split as PufferDrive bins
    (py123d/123Drive conversion 0.3.2). The default training set for
    development.
  license: >-
    CC BY-NC-SA 4.0 (nuPlan, Motional) — non-commercial use only, attribution
    required, share-alike. Keep this notice with any copy; do not publish
    outside the lab without the same license.

nuplan_mini_val:
  s3_uri: s3://pufferdrive-bins/nuplan/0.3.2-mini/val/
  size: ~10 GB, ~3.6k bins
  description: >-
    10 GB sample of the nuPlan validation split as PufferDrive bins
    (py123d/123Drive conversion 0.3.2). The default eval set for development.
  license: >-
    CC BY-NC-SA 4.0 (nuPlan, Motional) — non-commercial use only, attribution
    required, share-alike. Keep this notice with any copy; do not publish
    outside the lab without the same license.

nuplan_train:
  s3_uri: s3://pufferdrive-bins/nuplan/0.3.2/train/
  size: ~475 GB, ~170k bins
  description: >-
    Full nuPlan train split as PufferDrive bins (py123d/123Drive conversion
    0.3.2).
  license: >-
    CC BY-NC-SA 4.0 (nuPlan, Motional) — non-commercial use only, attribution
    required, share-alike. Keep this notice with any copy; do not publish
    outside the lab without the same license.

nuplan_val:
  s3_uri: s3://pufferdrive-bins/nuplan/0.3.2/val/
  size: ~48 GB, ~17k bins
  description: >-
    Full nuPlan validation split as PufferDrive bins (py123d/123Drive
    conversion 0.3.2).
  license: >-
    CC BY-NC-SA 4.0 (nuPlan, Motional) — non-commercial use only, attribution
    required, share-alike. Keep this notice with any copy; do not publish
    outside the lab without the same license.
