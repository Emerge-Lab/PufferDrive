pufferdrive_planner:
  _target_: pufferlib.ocean.cosim.nuplan.planner.PufferDrivePlanner
  _convert_: 'all'

  checkpoint_path: ???
  bin_cache_dir: ${oc.env:NUPLAN_EXP_ROOT}/pufferdrive_bin_cache
  # Whole-city map-only bins -- the only map source, no fallback.
  city_bin_dir: ???
  device: "cpu"
  map_radius: 400.0 # TODO: load from config
  goal_spacing: 20.0 # TODO: load from config
  goal_source: route # route (lane-graph route goal windows) | roadblock (route roadblock centroid windows) | roadblock_lane (roadblock goals on the lane continuing the ego lane)
  num_agents: 64 # TODO: load from config
  horizon_seconds: 8.0 # nuplan default
  deterministic: true
  # Ablations (defaults = off). sliding_goal_window: refill the goal window after every consumed goal so
  # the policy never sees a window-final (speed-gated) goal before the route end. Start-up jerk caps
  # [m/s^3, 0 = off] bound the ego's longitudinal jerk for the first startup_jerk_cap_seconds: nuPlan's
  # ego_lon_jerk extrapolates at the trajectory edges, ~2x the raw jerk of a ramp that starts at t=0.
  sliding_goal_window: false
  startup_jerk_cap_seconds: 1.5
  startup_accel_jerk_cap_mps3: 0.0
  startup_brake_jerk_cap_mps3: 0.0
  # eval hack: grow pedestrian and bicycle partner boxes by this much [m] in length and width in the policy's obs (training min 0.8 x 0.8); 0 = off
  vru_size_pad_m: 0.0
  # eval hack: shadow env loads a cached copy of the city bin with lane width = 2 x distance to the nearer GPKG boundary
  symmetric_lane_widths: false
  # Ego plant. pufferdrive: the shadow env's jerk model integrates the ego, nuPlan's perfect_tracking_controller
  # replays the pose. nuplan_bicycle: nuPlan's KinematicBicycleModel is the plant (run with
  # ego_controller=one_stage_controller); the shadow ego takes nuPlan's pose/speed/yaw rate every step, keeps its own
  # jerk-integrated accel/steering, and its post-step accel/steering are the model's commands. nuplan_tracker: the
  # planner returns the ego trajectory of a forecast rollout and nuPlan's two-stage controller tracks it (see rollout_*).
  # bicycle_min_speed_mps: speed floor enforced on the command (0 = CaRL's
  # no-reverse driving, -2 = Drive's MAX_BACKWARD_SPEED). bicycle_undo_low_pass: pre-compensate the model's command
  # lag (CaRL default off). The time constants must match the motion model (devkit 0.2 / 0.05).
  ego_dynamics: pufferdrive
  bicycle_min_speed_mps: 0.0
  bicycle_undo_low_pass: false
  bicycle_accel_time_constant_s: 0.2
  bicycle_steering_time_constant_s: 0.05
  # bicycle_center_accel_cap (nuplan_bicycle only, CaRL's clip_angular_adjustment): nuPlan scores the center accel,
  # which the devkit computes as rear accel + d*yaw_rate^2 + d*yaw_accel; the plant's accel is reduced while turning
  # to keep it under accel_cap_mps2. accel_cap_mps2: ego accel cap [m/s^2] (null = 0.96 x nuPlan's 2.40 comfort bound);
  # the policy's c_acc conditioning = cap / 2.5 must stay inside its training range.
  bicycle_center_accel_cap: false
  bicycle_center_accel_cap_margin: 1.0 # factor on accel_cap_mps2 for the center cap (savgol overshoot headroom)
  bicycle_max_yaw_jerk_radps3: 0.0 # bound on the per-step change of yaw accel via the steering command; 0 = off
  # clamp the policy's integrated accel to 0 while the plant sits on the speed floor (Drive's stop reset); false = run 426
  bicycle_floor_accel_clamp: true
  accel_cap_mps2: null
  # eval hack: partners longer than this [m] are shown as equal boxes along their heading (training max 7 m); 0 = off
  partner_split_max_length_m: 0.0
  # ego_dynamics: nuplan_tracker, GIGAFLOW's nuPlan evaluation (run with ego_controller=two_stage_controller for the
  # LQR tracker or two_stage_ilqr_controller for the iLQR tracker). Every step the shadow env takes the whole scene from
  # nuPlan and is rolled out for horizon_seconds in rollout_step_seconds steps (0.3 = the training step); the policy
  # drives the ego (from the plant's accel and steering) and the nearest rollout_policy_vehicles vehicles and bicycles,
  # which follow their lane; pedestrians and the rest keep their observed velocity. The ego's rolled-out states are
  # the trajectory nuPlan's tracker follows. rollout_allow_reverse: false = an agent the policy would back up stays at
  # rest (as bicycle_min_speed_mps 0).
  rollout_step_seconds: 0.3
  rollout_policy_vehicles: 32
  rollout_allow_reverse: false
  env_overrides:
    obs_slots_partners_n: 40 # GIGAFLOW eval value (Table A4); slots are max-pooled, so any checkpoint transfers
    stop_signs_enabled: false # nuPlan city bins export TURN_STOP zones as stop signs; keep them out of the obs
  # Write the interactive pufferlib.viz observation replay (exact policy input/outputs) per scenario
  obs_html_dir: null
  obs_html_max_steps: 800
  obs_html_render: true  # false: save .replay.zlib only, render later (scripts/eval/render_obs_html.py)
