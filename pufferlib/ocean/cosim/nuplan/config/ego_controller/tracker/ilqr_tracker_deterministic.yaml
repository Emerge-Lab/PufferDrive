# nuPlan's iLQR tracker without its wall-clock cap (stock max_solve_time 0.05 s: the full 20 iterations take ~45 ms on
# an idle workstation, so a loaded node cuts them short and the command depends on the hardware). Every solve now runs
# until convergence or max_ilqr_iterations.
defaults:
  - ilqr_tracker
  - _self_

ilqr_solver:
  solver_params:
    max_solve_time: null
