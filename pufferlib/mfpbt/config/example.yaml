# Total number of MF-PBT agents across all populations.
num_agents: 32

# One evolution frequency per population.
# Population i evolves when (round_index + 1) % frequencies[i] == 0.
frequencies:
  - 1
  - 10
  - 25
  - 50

# Number of CUDA devices used by the worker pool.
num_devices: 1

# Maximum number of concurrent agent jobs per device.
# Total concurrency = num_devices * num_agents_per_device.
num_agents_per_device: 4

# Number of MF-PBT rounds to run.
num_rounds: 2500

# Per-round training budget for each agent, expressed as additional env steps.
round_train_env_steps: 4_000_000

# Post-round evaluation metric used for ranking and genetics.
selection_metric: avg_distance_per_infraction

# MF-PBT evaluation mode. Defaults to gigaflow in the MF-PBT controller.
eval_simulation_mode: gigaflow

# Optional MF-PBT-specific evaluation overrides.
# eval_map_dir: pufferlib/resources/drive/binaries/carla
eval_num_scenarios: 40
eval_num_agents: 512
eval_num_carla_maps: 8

# Base directory where MF-PBT creates one fresh run folder per launch.
experiment_root: experiments/mfpbt

# Optional fixed run name. If omitted, MF-PBT uses env name + timestamp.
# run_name: my_debug_run

# Path to the full MF-PBT experiment checkpoint written by the controller.
# This is intended to store the whole experiment state, not just model weights:
# round index, agent metadata, hyperparameters, scores, env_steps,
# and full trainer states for restart. The filename is placed inside the run folder.
checkpoint_path: checkpoint.pt

# Optional directory for MF-PBT CSV logs.
# If omitted, logs are written inside the run folder under logs/.
# If set, only the final folder name is used inside the run folder.
# log_dir: logs

# Default hyperparameter values. These are also used for any hyperparameter
# that is not randomly sampled at initialization.
hyperparameters:
  learning_rate: 0.0005
  # ent_coef: 0.01

# Optional per-agent random initialization rules applied on top of hyperparameters.
# This is useful for the initial MF-PBT population.
initial_hyperparameter_sampling:
  learning_rate:
    distribution: log_uniform
    min: 1.0e-5
    max: 1.0e-3
  # ent_coef:
  #   distribution: log_uniform
  #   min: 1.0e-4
  #   max: 1.0e-1

# Hyperparameters that MF-PBT is allowed to copy and perturb.
tune_hyperparameters:
  - learning_rate
  # - ent_coef

# Multiplicative perturbation factors used after internal exploit.
perturb_factors:
  - 0.8
  - 1.25

# Multiprocessing start method for MF-PBT workers.
start_method: spawn
