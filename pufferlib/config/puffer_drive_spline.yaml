# Opt-in variant of puffer_drive.yaml for the spline terminal-boundary action mode.
# Usage: puffer train puffer_drive_spline [overrides...]
#
# trajectory_training is the only switch that matters here — flipping it forces
# env.action_type and policy.action_type to "spline" internally (config_schema.py's
# normalize_puffer_drive_config). Everything else below is inherited from puffer_drive.yaml
# unchanged; only the spline-specific knobs are overridden.
defaults:
  - puffer_drive
  - _self_

trajectory_training: true

env:
  # env.spline_horizon_seconds is inherited from puffer_drive.yaml (1.5s) unchanged; override it
  # here if this variant's horizon needs to diverge from the base config's.
  # Weight on the intent-consistency penalty (compute_spline_consistency_cost in drive.h).
  # Zero in the base config (the mechanism is inert by default); a small nonzero value here so
  # this variant actually exercises it. Placeholder — tune empirically.
  # 2026-09-16: 0.02 was measured (first ~350-epoch run) to average -63/episode vs. every other
  # reward_components/* term averaging -0.01 to -1 -- a ~60x scale mismatch that dominated the
  # PPO objective and coincided with entropy climbing unboundedly instead of settling (offroad_rate
  # and episode_length were both still flat at epoch 338 vs. epoch 100). Rescaled to 0.0003
  # accordingly; still measured too large relative to the other reward_components/* terms after
  # that first rescale, so cut by a further 10^4x. Still a placeholder pending real tuning.
  reward_trajectory_consistency: 0.00000003
