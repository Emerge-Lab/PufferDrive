[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
; Options: Recurrent, None
rnn_name = None

[vec]
num_envs =24
num_workers = auto
batch_size = auto
backend = Multiprocessing
seed = 42
; backend = Serial

[policy]
; Encoder layer (per-encoder embedding width)
ego_input_size = 64
partner_input_size = 64
lane_input_size = 64
boundary_input_size = 64
traffic_control_input_size = 64
context_input_size = 64
; Encoder activation - options: "relu", "tanh", "gelu"
encoder_activation = "relu"
encoder_layer_norm = True
; Mask padded object slots before max-pooling. Requires obs valid-count features.
mask_padded_features = False
; Shared backbone layer
backbone_hidden_size = 512
backbone_num_layers = 4
; Backbone activation - options: "relu", "tanh", "gelu"
backbone_activation = "gelu"
backbone_layer_norm = False
; Actor head layer
actor_hidden_size = 512
actor_num_layers = 0
; Critic head layer
critic_hidden_size = 512
critic_num_layers = 0
; Dual or shared actor-critic backbone
shared_network = True

[rnn]
input_size = 512
hidden_size = 512

[env]
; --- Simulation ---
; Options: "gigaflow", "replay"
simulation_mode = "gigaflow"
reward_conditioning = False
reward_randomization = False
; Total number of agents in the environment
num_agents = 1024
; GIGAFLOW-specific: fixed number of agents per environment for adversarial training
min_agents_per_env = 2
max_agents_per_env = 6
; Actions type - options: "discrete", "continuous"
action_type = "discrete"
; Dynamics model - options: "classic", "jerk"
dynamics_model = "jerk"
; Time delta between steps in seconds
dt = 0.1
; Optional nonzero launch speed for gigaflow random spawns
spawn_initial_speed = 0.0
; Target representation - options: "static", "dynamic"
target_type = "static"
; Collision behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 1
; If true, vehicle collisions involving active-agent slot 0 are logged/rewarded
; but do not apply collision_behavior to either participant.
ignore_target_collision_behavior = False
; If true, target collision/offroad removes only the target and lets other
; agents continue. Use with adversarial_termination_mode = 1 to keep episodes
; running after target death until adversaries die.
remove_target_on_collision_or_offroad = True
; Offroad behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 1
; Traffic light behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
traffic_light_behavior = 0

; --- Rewards ---
reward_goal = 1.0
reward_vehicle_collision = 1.5
reward_offroad_collision = 1.5
reward_stop_line = 1.0
reward_comfort = 0.05
reward_lane_align = 0.03
reward_vel_align = 1.0
reward_lane_center = 0.0038
reward_center_bias = 0.0
reward_velocity = 0.0025
reward_reverse = 0.01
reward_timestep = 0.000025
reward_overspeed = 0.05
reward_ade = 0.0

; --- Adversarial Agents weighting ---
adv_reward_weight_collision = 1.0
adv_reward_weight_offroad = 1.0
adv_reward_weight_drive = 0.5
adv_reward_weight_traffic_light = 3.0

; --- Target failure adversarial reward ---
adv_target_offroad_reward = 0.0
; Reward for an avoidable collision without danger in the reaction window.
adv_target_collision_reward = 0.5
; Legacy compatibility option; reward is no longer weighted or gated by
; closing-motion responsibility.
adv_target_collision_reward_use_responsibility = False
; Reward for a genuine target failure (avoidable with reaction-window danger).
adv_target_failure_reward = 2.0
; Shared bonus when the eventual hitter is compliant and the collision is avoidable.
adv_compliant_bonus = 1.5
; Additional shared bonus when that avoidable collision is also a genuine target failure.
adv_genuine_compliant_bonus = 6.5
; Legacy separate-time shaping options retained for configuration compatibility.
adv_target_avoidability_reward = 0.0
adv_target_detection_reward = 0.0
adv_target_time_reward_tau = 2.0
; Optional extra bonus when nuPlan says the target is at fault.
adv_target_hit_at_fault_bonus = 0.0
; Diagnostic threshold only; it no longer gates reward or termination.
adv_target_hit_low_responsibility_threshold = 0.01
; Physically unavoidable target hits receive no target-collision reward.
adv_target_hit_unavoidable_penalty = 0.5
; 0 disabled, 1 terminate all, 2 terminate the hitter only.
adv_target_hit_unavoidable_behavior = 2

; --- Goal / Target ---
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Maximum speed at final waypoint to count goal reward
goal_speed = 100.0
; Number of target waypoints in the observation (including goal)
num_target_waypoints = 3
; Waypoint spacing range in meters when building path
min_waypoint_spacing = 20.0
max_waypoint_spacing = 40.0

; --- Episode control ---
; Number of steps before reset
scenario_length = 256
; Frequency of resampling scenario (in steps), 0 to disable
resample_frequency = 0
; End of episode - options: 0 - scenario_length, 1 - early reset when too many agents are removed
termination_mode = 1
; Ratio of inactive agents (stopped/removed) that triggers early reset (used when termination_mode = 1)
inactive_agent_threshold = 0.2
; Adversarial early reset - options:
; 0 - disabled
; 1 - reset when no adversarial agents remain alive
; 2 - reset when the target agent dies
; 3 - reset on either condition
adversarial_termination_mode = 1
; When adversarial_termination_mode is 2 or 3 and the target failure triggers
; the episode reset, send terminated=True to all agents instead of truncated=True.
terminate_ep_on_target_failure = False

; --- Map ---
map_dir = "pufferlib/resources/drive/binaries/carla"
num_maps = 8
; Gigaflow-only map selection. Use all to load every .bin file in map_dir,
; or select explicit maps with examples: 2,5,10 or Town02,Town05,Town10.
; When set, this overrides num_maps.
maps = none
; Gigaflow-only targeted adversary spawning around agent 0.
; 0 = disabled, 1 = prefer drivable spawn samples within targeted_spawn_radius, then fallback globally.
targeted_spawn_mode = 1
; Radius in meters around agent 0 used by targeted Gigaflow spawning.
targeted_spawn_radius = 50.0
; Number of near-target attempts before falling back to the global Gigaflow sampler.
targeted_spawn_attempts = 5
; Minimum center-to-center distance between normally spawned agents.
spawn_min_separation = 3.0
; Per-adversary probability of intentionally trying to spawn inside the minimum-separation circle around the target.
targeted_spawn_close_probability = 0.05
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; options: "control_vehicles", "control_agents", "control_tracks_to_predict", "control_sdc_only"
control_mode = "control_vehicles"
; Controller used by active-agent slot 0, the canonical SDC/target.
; options: "static", "policy", "replay", "idm", "corridor_idm", "pdm", "nuplan_idm"
sdc_controller = "policy"
; Controller used by all other agents. "policy" uses RL actions for active
; agents and falls back to replay for non-active replay/static agents.
; options: "static", "policy", "replay", "idm", "corridor_idm", "pdm", "nuplan_idm"
non_sdc_controller = "policy"
; PDM planner horizon in seconds. Fast baseline: 4.0, strong baseline: 8.0.
pdm_horizon = 4.0
; PDM collision/offroad sampling interval in seconds. Fast baseline: 0.5, strong baseline: 0.1.
pdm_planning_dt = 0.1
; Options: "create_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
; Enable computation of evaluation-only metrics
compute_eval_metrics = False

; --- Observation limits ---
max_lane_segment_observations = 80
; Fraction of lane segment observation slots to drop (reduces obs size)
lane_segment_dropout = 0.0
max_boundary_segment_observations = 80
; Fraction of boundary segment observation slots to drop (reduces obs size)
boundary_segment_dropout = 0.0
; Target keeps the partner budget from the non-adversarial branch.
target_max_partner_observations = 16
; -1 derives adversary partner slots from max_agents_per_env - 1.
adversary_max_partner_observations = -1
max_traffic_control_observations = 4
; options: 0 - traffic lights, 1 - traffic lights & stop signs, 2 - all traffic controls
traffic_control_scope = 0

; --- Robustness features ---
; Erratic agents are selected once per episode; masked out of the PPO rollout buffer.
; Per-episode probability that an agent is blind to other agents for the whole episode
partner_blindness_prob = 0.0
; Per-episode probability that an agent is flagged as a phantom braker for the whole episode
phantom_braking_prob = 0.0
; Per-step probability that a flagged phantom-braker actually initiates a brake window
phantom_braking_trigger_prob = 0.0
; Duration (in steps) of phantom braking once triggered
phantom_braking_duration = 10

; --- Observation normalization ---
max_goal_position = 120.0
max_position = 120.0
max_veh_len = 15.0
max_veh_width = 10.0
max_road_segment_length = 10.0
max_road_segment_width = 5.0

; --- Observation distances ---
max_traffic_control_distance = 100.0
agent_obs_max_dist = 200
; Target-policy-only partner visibility cap applied in Python before target inference.
target_max_partner_obs_distance = 100.0
road_obs_front_dist = 120.0
road_obs_behind_dist = 20.0
road_obs_side_dist = 30.0

[train]
seed = 42
target_policy = "experiments/self_play_target.pt"
; Target policy config is used to reconstruct frozen target architecture and
; target-only observation layout. Use conditionned_target_config.yaml with
; conditionned_target.pt.
target_policy_config = None
total_timesteps = 50_000_000_000
checkpoint_interval = 500
anneal_lr = True
; batch_size = num_workers * num_agents * bptt_horizon
batch_size = auto
minibatch_size = 98304
max_minibatch_size = 98304
bptt_horizon = 128
learning_rate = 0.0005
gae_lambda = 0.95
gamma = 0.995
ent_coef = 0.01
clip_coef = 0.2
max_grad_norm = 0.5
vf_clip_coef = None
vf_coef = 0.5
update_epochs = 2
normalize_rewards = True
best_model_metric = "did_target_collide"
; ---
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
vtrace_c_clip = 1
vtrace_rho_clip = 1
ppo_granularity = auto
adv_sampling_prio_alpha = 0.8499999999999999
adv_sampling_prio_beta0 = 0.8499999999999999
adv_filter_ewma_beta = 0.25
adv_filter_threshold_scale = 0.01
; Rendering options
render = False
render_interval = 1000
; If True, show exactly what the agent sees in agent observation
obs_only = True
; Show grid lines
show_grid = False
; Draws lines from ego agent observed ORUs and road elements to show detection range
show_lasers = False
; Display human xy logs in the background
show_human_logs = True
; Options: List[str to path], str to path (e.g., "resources/drive/training/binaries/map_001.bin"), None
render_map = none

[eval]
; Set to True to enable periodic multi-scenario evaluation during training
multi_scenario_eval = False
; Frequency of evaluation during training (in epochs)
eval_interval = 25
num_agents = 512
; Batch size for eval_multi_scenarios (number of scenarios per batch)
; Path to dataset used for evaluation
map_dir = "pufferlib/resources/drive/binaries/carla"
; Simulation mode for evaluation: "gigaflow" or "replay"
multi_scenario_simulation_mode = "replay"
; Total number of scenarios to evaluate
multi_scenario_num_scenarios = 250
backend = PufferEnv
; WOSAC (Waymo Open Sim Agents Challenge) evaluation settings
; If True, enables evaluation on realism metrics each time we save a checkpoint
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_num_agents = 256
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
; If True, enable human replay evaluation (pair policy-controlled agent with human replays)
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
human_replay_num_agents = 64

