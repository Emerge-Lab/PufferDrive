[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
; Options: Recurrent, None
rnn_name = None

[vec]
num_envs = 20
num_workers = auto
batch_size = auto

[policy]
; Encoder layer
input_size = 64
encoder_gigaflow = True
dropout = 0.0
; Shared backbone layer
backbone_hidden_size = 512
backbone_num_layers = 4
; Actor head layer
actor_hidden_size = 512
actor_num_layers = 0
; Critic head layer
critic_hidden_size = 512
critic_num_layers = 0
; Dual or shared actor-critic backbone
split_network = False

[rnn]
input_size = 512
hidden_size = 512

[env]
; --- Simulation ---
; Options: "gigaflow", "replay"
simulation_mode = "gigaflow"
; Total number of agents in the environment
num_agents = 1024
; GIGAFLOW-specific: minimum/maximum number of agents per environment
min_agents_per_env = 1
max_agents_per_env = 80
; Actions type - options: "discrete", "continuous"
action_type = "discrete"
; Dynamics model - options: "classic", "jerk"
dynamics_model = "jerk"
; Time delta between steps in seconds
dt = 0.1
; Optional nonzero launch speed for gigaflow random spawns
spawn_initial_speed = 0.0
; Collision behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 1
; Offroad behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 1
; Traffic light behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
traffic_light_behavior = 1
; Number of steps before reset
scenario_length = 1280
; Frequency of resampling scenario (in steps), 0 to disable
resample_frequency = 12_800_0000
; End of episode - options: 0 - scenario_length, 1 - early reset when too many agents are removed
termination_mode = 1
; Ratio of inactive agents (stopped/removed) that triggers early reset (used when termination_mode = 1)
inactive_agent_threshold = 0.4
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; options: "control_vehicles", "control_agents", "control_tracks_to_predict", "control_sdc_only"
control_mode = "control_vehicles"
; Options: "created_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
; Enable computation of evaluation-only metrics
compute_eval_metrics = False

; --- Goal / Target ---
; Target representation - options: "static", "dynamic"
target_type = "static"
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Maximum speed at final waypoint to count goal reward
goal_speed = 1000.0
; Number of target waypoints in the observation (including goal)
num_target_waypoints = 3
; Waypoint spacing range in meters when building path
min_waypoint_spacing = 20.0
max_waypoint_spacing = 60.0

; --- Rewards ---
reward_conditioning = False
reward_randomization = False
reward_goal = 1.0
reward_vehicle_collision = 1.0
reward_offroad_collision = 1.0
reward_stop_line = 1.0
reward_comfort = 0.05
reward_lane_align = 0.025
reward_vel_align = 1.0
reward_lane_center = 0.0038
reward_center_bias = 0.0
reward_velocity = 0.1
reward_reverse = 0.005
reward_timestep = 0.000025
reward_overspeed = 0.05
reward_ade = 0.0

; --- Map ---
; Path to map used for training
map_dir = "pufferlib/resources/drive/binaries/carla_py123d"
; Number of maps to load from map_dir
num_maps = 8

; --- Observation limits ---
max_lane_segment_observations = 80
; Fraction of lane segment observation slots to drop (reduces obs size)
lane_segment_dropout = 0.0
max_boundary_segment_observations = 80
; Fraction of boundary segment observation slots to drop (reduces obs size)
boundary_segment_dropout = 0.0
max_partner_observations = 16
max_traffic_control_observations = 4
; options: 0 - traffic lights, 1 - traffic lights & stop signs, 2 - all traffic controls
traffic_control_scope = 0

; --- Robustness features---
; Erratic agents are selected once per episode; masked out of the PPO rollout buffer.
; Per-episode probability that an agent is blind to other agents for the whole episode
partner_blindness_prob = 0.0
; Per-step probability that a flagged blind-partner agent zeros out its partner observations
partner_blindness_trigger_prob = 0.0
; Per-episode probability that an agent is flagged as a phantom braker for the whole episode
phantom_braking_prob = 0.0
; Per-step probability that a flagged phantom-braker actually initiates a brake window
phantom_braking_trigger_prob = 0.0
; Duration (in steps) of phantom braking once triggered
phantom_braking_duration = 10

; --- Observation normalization ---
max_goal_position = 100.0
max_position = 100.0
max_veh_len = 15.0
max_veh_width = 10.0
max_road_segment_length = 5.0
max_road_segment_width = 5.0

; --- Observation distances ---
max_traffic_control_distance = 100.0
agent_obs_max_dist = 100.0
road_obs_front_dist = 100.0
road_obs_behind_dist = 20.0
road_obs_side_dist = 30.0

[train]
total_timesteps = 10_000_000_000
checkpoint_interval = 50
anneal_lr = True
; batch_size = num_workers * num_agents *  bptt_horizon
batch_size = auto
minibatch_size = 65_536
max_minibatch_size = 65_536
bptt_horizon = 128
learning_rate = 0.0005
gae_lambda = 0.95
gamma = 0.999
ent_coef = 0.01
clip_coef = 0.2
max_grad_norm = 0.5
vf_clip_coef = None
vf_coef = 0.5
update_epochs = 2
normalize_rewards = True
; ---
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
vtrace_c_clip = 1
vtrace_rho_clip = 1
ppo_granularity = auto
adv_sampling_prio_alpha = 0.8499999999999999
adv_sampling_prio_beta0 = 0.8499999999999999
adv_filter_ewma_beta = 0.25
adv_filter_threshold_scale = 0.01
; Rendering options
render = False
render_interval = 1000
; If True, show exactly what the agent sees in agent observation
obs_only = True
; Show grid lines
show_grid = False
; Draws lines from ego agent observed ORUs and road elements to show detection range
show_lasers = False
; Display human xy logs in the background
show_human_logs = True
; Options: List[str to path], str to path (e.g., "resources/drive/training/binaries/map_001.bin"), None
render_map = none

; ===========================================================================
; Evaluation suites
;
; Each [eval.<name>] section is one Evaluator instance. EvalManager discovers
; them via auto-discovery (any section under [eval] with a `type` field).
; Sections without a `type` field are templates — referenced from other
; sections via `inherits = "<template_name>"`.
;
; Field reference:
;   type           — registered evaluator class (multi_scenario, behavior_class,
;                    human_replay, wosac)
;   enabled        — true|false
;   interval       — epochs between runs (0 disables)
;   mode           — "inline" (block training) | "subprocess" (spawn process)
;   inherits       — pull defaults from another section, recursively
;   clean          — true → zero perturbations + dropout + enforce red lights
;   render         — true → capture mp4(s) during rollout
;   render_views   — list of camera views: sim_state, bev, topdown_sim, bev_all
;   env.<key>      — any [env] override (dotted key)
;   eval.<key>     — evaluator-specific knob (e.g. num_scenarios)
;   vec.<key>      — any [vec] override
; ===========================================================================

[mine]
; Failure-mining workflow. `puffer mine_failures puffer_drive ...`
; rolls a trained policy out N times and writes compact-replay HTML
; for episodes whose episode_return is strictly below score_threshold.
output_dir = ""
num_episodes = 100
score_threshold = -inf
render = true

[eval]
; Set to True to enable periodic multi-scenario evaluation during training
multi_scenario_eval = False
; Frequency of evaluation during training (in epochs)
eval_interval = 25
num_agents = 512
; Batch size for eval_multi_scenarios (number of scenarios per batch)
; Path to dataset used for evaluation
map_dir = "pufferlib/resources/drive/binaries/eval"
; Simulation mode for evaluation: "gigaflow" or "replay"
multi_scenario_simulation_mode = "replay"
; Total number of scenarios to evaluate
multi_scenario_num_scenarios = 250
backend = PufferEnv


[eval.validation_replay]
type = "multi_scenario"
enabled = true
interval = 250
mode = "inline"
clean = true
render = true
render_backend = "html"
env.simulation_mode = "replay"
env.control_mode = "control_sdc_only"
env.map_dir = "/home/ricky/nuBenchmark/.data/bins/deduped_set/training"
env.num_maps = 10
env.num_agents = 10
env.min_agents_per_env = 1
env.max_agents_per_env = 1
env.scenario_length = 91
env.resample_frequency = 91
eval.num_scenarios = 10
eval.render_num_scenarios = 5
eval.render_max_steps = 91

[eval.validation_gigaflow]
type = "multi_scenario"
enabled = true
interval = 250
mode = "inline"
clean = true
render = true
render_views = ["sim_state", "bev"]
env.simulation_mode = "gigaflow"
env.map_dir = "pufferlib/resources/drive/binaries/carla_py123d"
env.num_maps = 8
env.num_agents = 400
env.min_agents_per_env = 50
env.max_agents_per_env = 50
env.scenario_length = 3000
env.resample_frequency = 3000
; One rollout per carla map. Render every map so the wandb panel covers
; all 8 (rather than a 5-sample subset).
eval.num_scenarios = 8
eval.render_num_scenarios = 8
eval.render_max_steps = 300

; ---------------------------------------------------------------------------
; Driving-behaviour evaluation: nuPlan scenes labeled by scene type. Each
; behavior is one [eval.behaviors_*] section. All inherit from the template
; below — change shared knobs in one place.
; ---------------------------------------------------------------------------

[eval.behaviors_defaults]
enabled = false
interval = 250
mode = "inline"
clean = true
render = true
render_views = ["sim_state", "bev"]
env.simulation_mode = "replay"
env.control_mode = "control_sdc_only"
env.init_mode = "create_all_valid"
env.scenario_length = 201
env.max_partner_observations = 32
eval.num_scenarios = 50
eval.render_num_scenarios = 2
eval.render_max_steps = 200

[eval.behaviors_full_dir]
inherits = "behaviors_defaults"
type = "behavior_class"
enabled = true
env.map_dir = "/scratch/ev2237/data/nuplan/nuplan_mini_train_bins"

[eval.behaviors_hard_stop]
