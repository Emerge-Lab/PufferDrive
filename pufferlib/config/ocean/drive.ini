[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
; Options: Recurrent, None
rnn_name = None

[vec]
num_envs = 20
num_workers = auto
batch_size = auto

[policy]
; Encoder layer (per-encoder embedding width)
ego_input_size = 64
partner_input_size = 64
lane_input_size = 64
boundary_input_size = 64
traffic_control_input_size = 64
context_input_size = 64
; Encoder activation - options: "relu", "tanh", "gelu"
encoder_activation = "relu"
encoder_layer_norm = True
mask_padded_features = False
; Shared backbone layer
backbone_hidden_size = 512
backbone_num_layers = 4
; Backbone activation - options: "relu", "tanh", "gelu"
backbone_activation = "gelu"
backbone_layer_norm = False
; Actor head layer
actor_hidden_size = 512
actor_num_layers = 0
; Critic head layer
critic_hidden_size = 512
critic_num_layers = 0
; Dual or shared actor-critic backbone
shared_network = True

[rnn]
input_size = 512
hidden_size = 512

[env]
; --- Simulation ---
; Options: "gigaflow", "replay"
simulation_mode = "gigaflow"
; Total number of agents in the environment
num_agents = 1024
; GIGAFLOW-specific: minimum/maximum number of agents per environment
min_agents_per_env = 1
max_agents_per_env = 80
; Actions type - options: "discrete", "continuous"
action_type = "discrete"
; Dynamics model - options: "classic", "jerk"
dynamics_model = "jerk"
; Time delta between steps in seconds
dt = 0.1
; Optional nonzero launch speed for gigaflow random spawns
spawn_initial_speed = 0.0
; Collision behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 1
; Offroad behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 1
; Traffic light behavior - options: 0 - Ignore, 1 - Stop, 2 - Remove
traffic_light_behavior = 1
; Share static map geometry (roads/grid/lane-graph) across envs using the same map - 0 off, 1 on
use_map_cache = 0
; Number of steps before reset
scenario_length = 1280
; Frequency of resampling scenario (in steps), 0 to disable
resample_frequency = 12_800_0000
; End of episode - options: 0 - scenario_length, 1 - early reset when too many agents are removed
termination_mode = 1
; Ratio of inactive agents (stopped/removed) that triggers early reset (used when termination_mode = 1)
inactive_agent_threshold = 0.4
; End the episode as soon as the agent reaches its final goal. Only active in
; control_sdc_only replay mode (single active agent).
terminate_on_goal = 0
; Determines which step of the trajectory to initialize the agents at upon reset
init_step = 0
; allows to initiate the C environment at random init points - works in replay mode only:
init_step_spread = False
; sets an upper bound on the random init step
; the sampled init step can be at most this close to the end of the episode;
init_step_min_horizon = 20
; options: "control_vehicles", "control_agents", "control_tracks_to_predict", "control_sdc_only"
control_mode = "control_vehicles"
; Controller used by agent 0, the canonical SDC/target.
; options: "static", "policy", "replay", "idm"
sdc_controller = "policy"
; Controller used by non-SDC vehicles.
; options: "static", "policy", "replay", "idm"
non_sdc_controller = "policy"
; Controller used by non-vehicle agents. "auto" follows non_sdc_controller unless it is "idm", then it uses "replay".
; options: "auto", "static", "policy", "replay", "idm"
non_vehicle_controller = "auto"
; Options: "created_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
; Enable computation of evaluation-only metrics
compute_eval_metrics = False

; --- Goal / Target ---
; Target representation - options: "static", "dynamic"
target_type = "static"
; True: place goals along the agent's route (existing behavior, on-lane and
; in front of the agent). False: scatter each goal at a uniformly random
; drivable point anywhere on the map.
goal_on_lane = True
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Maximum speed at final waypoint to count goal reward
goal_speed = 1000.0
; Number of target waypoints in the observation (including goal)
num_goals = 3
; Waypoint spacing range in meters when building path
min_goal_spacing = 20.0
max_goal_spacing = 60.0

; --- Rewards ---
reward_conditioning = False
reward_randomization = False
reward_goal = 1.0
reward_collision = 1.5
reward_offroad = 1.5
reward_stop_line = 1.0
reward_comfort = 0.05
reward_lane_align = 0.025
reward_vel_align = 1.0
reward_lane_center = 0.0038
reward_center_bias = 0.0
reward_velocity = 0.0025
reward_reverse = 0.005
reward_timestep = 0.000025
reward_overspeed = 0.05
reward_ade = 0.0

; --- Map ---
; Path to map used for training
map_dir = "pufferlib/resources/drive/binaries/carla"
; Number of maps to load from map_dir
num_maps = 8

; --- Observation slot counts ---
obs_slots_lane_n = 80
obs_slots_boundary_n = 80
obs_slots_partners_n = 16
obs_slots_traffic_controls_n = 4
; Fraction of segment observation slots to drop (reduces obs size)
obs_dropout_lane = 0.0
obs_dropout_boundary = 0.0
; Stride for lane and boundary segments; 1 means use every segment, 2 means use every other segment, etc.
obs_lane_stride = 1
obs_boundary_stride = 1
; --- Observation normalization ---
obs_norm_goal_offset_m = 120.0
obs_norm_xy_offset_m = 120.0
obs_norm_veh_length_m = 15.0
obs_norm_veh_width_m = 10.0
obs_norm_road_seg_length_m = 10.0
obs_norm_road_seg_width_m = 5.0
; --- Observation ranges (meters, ego frame) ---
obs_range_road_front_m = 120.0
obs_range_road_behind_m = 20.0
obs_range_road_side_m = 30.0
obs_range_partner_m = 100.0
obs_range_traffic_control_m = 100.0

; --- Robustness features---
; Erratic agents are selected once per episode; masked out of the PPO rollout buffer.
; Per-episode probability that an agent is blind to other agents for the whole episode
partner_blindness_prob = 0.0
; Per-step probability that a flagged blind-partner agent zeros out its partner observations
partner_blindness_trigger_prob = 0.0
; Per-episode probability that an agent is flagged as a phantom braker for the whole episode
phantom_braking_prob = 0.0
; Per-step probability that a flagged phantom-braker actually initiates a brake window
phantom_braking_trigger_prob = 0.0
; Duration (in steps) of phantom braking once triggered
phantom_braking_duration = 10

[train]
total_timesteps = 10_000_000_000
checkpoint_interval = 50
anneal_lr = True
; batch_size = num_workers * num_agents *  bptt_horizon
batch_size = auto
minibatch_size = 65_536
max_minibatch_size = 65_536
bptt_horizon = 128
learning_rate = 0.0005
gae_lambda = 0.95
gamma = 0.999
ent_coef = 0.01
clip_coef = 0.2
max_grad_norm = 0.5
vf_clip_coef = None
vf_coef = 0.5
update_epochs = 2
normalize_rewards = True
; ---
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
vtrace_c_clip = 1
vtrace_rho_clip = 1
adv_sampling_prio_alpha = 0.8499999999999999
adv_sampling_prio_beta0 = 0.8499999999999999
adv_filter_ewma_beta = 0.25
adv_filter_threshold_scale = 0.01
; Rendering options
render = False
render_interval = 1000
; If True, show exactly what the agent sees in agent observation
obs_only = True
; Show grid lines
show_grid = False
; Draws lines from ego agent observed ORUs and road elements to show detection range
show_lasers = False
; Display human xy logs in the background
show_human_logs = True
; Options: List[str to path], str to path (e.g., "resources/drive/training/binaries/map_001.bin"), None
render_map = none

; ===========================================================================
; Evaluation suites
;
; Each [eval.<name>] section is one Evaluator instance. EvalManager discovers
; them via auto-discovery (any section under [eval] with a `type` field).
; Sections without a `type` field are templates — referenced from other
; sections via `inherits = "<template_name>"`.
;
; Field reference:
;   type           — registered evaluator class (multi_scenario, behavior_class,
;                    human_replay, wosac)
;   enabled        — true|false
;   interval       — epochs between runs (0 disables)
;   mode           — "inline" (block training) | "subprocess" (spawn process)
;   inherits       — pull defaults from another section, recursively
;   clean          — true → zero perturbations + dropout + enforce red lights
;   render         — true → capture mp4(s) during rollout
;   render_views   — list of camera views: sim_state, bev, topdown_sim, bev_all
;   env.<key>      — any [env] override (dotted key)
;   eval.<key>     — evaluator-specific knob (e.g. num_scenarios)
;   vec.<key>      — any [vec] override
; ===========================================================================

[mine]
; Failure-mining workflow. `puffer mine_failures puffer_drive ...`
; rolls a trained policy out N times and writes compact-replay HTML
; for episodes whose episode_return is strictly below score_threshold.
output_dir = ""
num_episodes = 100
score_threshold = -inf
render = true

; ---------------------------------------------------------------------------
; Multi-scenario validation eval. validation_defaults holds the shared
; clean-eval env + fixed eval reward weights; the replay / gigaflow sections
; add their sim-specific map set and agent layout. Each sweeps 250 scenarios,
; ignores traffic lights, and disables reward randomization so metrics are
; comparable across checkpoints. Both write a per-episode CSV and a coverage
; report (episode_metrics/).
; ---------------------------------------------------------------------------

[eval.validation_defaults]
enabled = true
interval = 250
mode = "inline"
clean = true
env.eval_mode = 1
env.collision_behavior = 1
env.offroad_behavior = 1
; Explicit 0 wins over the clean macro's red-light enforcement.
env.traffic_light_behavior = 0
env.reward_randomization = False
env.termination_mode = 0
env.num_agents = 1024
env.target_type = "static"
env.goal_speed = 3.0
env.reward_collision = 3.0
env.reward_offroad = 3.0
env.reward_stop_line = 1.0
env.reward_goal = 1.0
env.reward_overspeed = 0.05
env.reward_comfort = 0.05
env.reward_velocity = 0.0025
env.reward_lane_align = 0.025
env.reward_lane_center = 0.0038
env.reward_timestep = 0.000025
env.reward_reverse = 0.005
env.reward_ade = 0.0
env.obs_dropout_lane = 0.0
env.obs_dropout_boundary = 0.0
env.obs_slots_lane_n = 80
env.obs_slots_boundary_n = 80
eval.num_scenarios = 250
eval.export_episode_csv = true
eval.verify_coverage = true

[eval.validation_replay]
inherits = "validation_defaults"
type = "multi_scenario"
enabled = false
render = true
render_backend = "obs_html"
env.simulation_mode = "replay"
env.control_mode = "control_sdc_only"
env.map_dir = "data/nuplan_mini_val"
env.num_maps = 250
env.max_agents_per_env = 64
env.scenario_length = 200
env.resample_frequency = 200
eval.render_num_scenarios = 5
eval.render_max_steps = 200

[eval.validation_gigaflow]
inherits = "validation_defaults"
type = "multi_scenario"
enabled = true
render = true
render_backend = "egl"
render_views = ["sim_state", "bev"]
env.simulation_mode = "gigaflow"
env.map_dir = "pufferlib/resources/drive/binaries/carla"
env.num_maps = 8
env.num_agents = 1024
env.min_agents_per_env = 40
env.max_agents_per_env = 40
env.scenario_length = 500
env.resample_frequency = 500
eval.render_num_scenarios = 8
eval.render_max_steps = 300

[eval.dnf_triage]
inherits = "validation_defaults"
type = "multi_scenario"
enabled = false
render = true
render_backend = "triage_html"
env.simulation_mode = "gigaflow"
env.map_dir = "pufferlib/resources/drive/binaries/carla/opendrive__Town10HD.bin"
env.num_maps = 1
env.min_agents_per_env = 1
env.max_agents_per_env = 1
env.scenario_length = 500
env.resample_frequency = 500
eval.num_scenarios = 32
eval.render_num_scenarios = 16
eval.render_max_steps = 300

[eval.behaviors_defaults]
enabled = false
interval = 250
mode = "inline"
clean = true
render = true
render_views = ["sim_state", "bev"]
env.simulation_mode = "replay"
env.control_mode = "control_sdc_only"
env.init_mode = "create_all_valid"
env.scenario_length = 201
env.obs_slots_partners_n = 32
eval.num_scenarios = 50
eval.render_num_scenarios = 2
eval.render_max_steps = 200

[eval.behaviors_full_dir]
inherits = "behaviors_defaults"
type = "behavior_class"
env.map_dir = "data/nuplan_mini_val"

; ---------------------------------------------------------------------------
; Optional: WOSAC realism eval. Off by default.
; ---------------------------------------------------------------------------

[eval.wosac]
type = "wosac"
enabled = false
interval = 500
mode = "subprocess"
clean = true
render = false
env.control_mode = "control_wosac"
env.init_mode = "create_all_valid"
env.init_step = 10
env.goal_radius = 2.0
eval.wosac_num_rollouts = 32
eval.wosac_num_agents = 256
eval.wosac_sanity_check = false
eval.wosac_aggregate_results = true

