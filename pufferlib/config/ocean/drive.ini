[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = None

[vec]
num_envs = 6
num_workers = auto
batch_size = auto
; backend = Serial

[policy]
input_size = 128
backbone_hidden_size = 512
backbone_num_layers = 4
actor_hidden_size = 512
actor_num_layers = 0
critic_hidden_size = 512
critic_num_layers = 0
split_network = False
encoder_gigaflow = True
dropout = 0.2

[rnn]
input_size = 512
hidden_size = 512

[env]
simulation_mode = "gigaflow"
reward_conditioning = False
reward_randomization = False
num_agents = 1024
min_agents_per_env = 1
max_agents_per_env = 120
action_type = "discrete"
dynamics_model = "jerk"
dt = 0.1
spawn_initial_speed = 0.0
target_type = "static"
collision_behavior = 1
offroad_behavior = 1
traffic_light_behavior = 1
reward_goal = 1.0
reward_vehicle_collision = 1.0
reward_offroad_collision = 1.0
reward_stop_line = 1.0
reward_comfort = 0.05
reward_lane_align = 0.025
reward_vel_align = 1.0
reward_lane_center = 0.0038
reward_center_bias = 0.0
reward_velocity = 0.0025
reward_reverse = 0.005
reward_timestep = 0.000025
reward_overspeed = 0.05
reward_ade = 0.0
goal_radius = 2.0
num_target_waypoints = 3
min_waypoint_spacing = 20.0
max_waypoint_spacing = 60.0
scenario_length = 1280
resample_frequency = -1
termination_mode = 1
inactive_agent_threshold = 0.4
map_dir = "pufferlib/resources/drive/binaries/carla"
num_maps = 8
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
compute_eval_metrics = True
use_rear_axle = True
max_lane_segment_observations = 80
max_boundary_segment_observations = 60
max_partner_observations = 20
max_traffic_control_observations = 4
traffic_control_scope = 0

[train]
total_timesteps = 10_000_000_000
anneal_lr = True
batch_size = auto
minibatch_size = 24576
max_minibatch_size = 24576
bptt_horizon = 128
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.01
gae_lambda = 0.95
gamma = 0.999
learning_rate = 0.0005
max_grad_norm = 0.5
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 2
vf_clip_coef = None
vf_coef = 0.5
vtrace_c_clip = 1
vtrace_rho_clip = 1
normalize_rewards = True
ppo_granularity = auto
adv_filter_ewma_beta = 0.25
adv_filter_threshold_scale = 0.01
checkpoint_interval = 500
log_interval = 10
render = False
render_interval = 1000
obs_only = True
show_grid = False
show_lasers = False
show_human_logs = True
render_map = none

[eval]
multi_scenario_eval = False
eval_interval = 25
num_agents = 512
map_dir = "pufferlib/resources/drive/binaries/eval"
multi_scenario_simulation_mode = "replay"
multi_scenario_num_scenarios = 250
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_num_agents = 256
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
human_replay_num_agents = 64

[controlled_exp.train.learning_rate]
values = [0.001, 0.003, 0.01]

[controlled_exp.train.ent_coef]
values = [0.01, 0.005]
