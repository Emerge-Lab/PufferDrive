[base]
package = ocean
env_name = puffer_drive_curriculum
policy_name = Drive
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_workers = 8
num_envs = 8
batch_size = 4
zero_copy = True
seed = 42

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

; Stage 1 is the current Waymo task: short episodes, remove the agent at the
; goal, and drop the steps after done. No anchor and no regularization.
[env]
num_agents = 1024
action_type = discrete
dynamics_model = classic
fix_rewards = True
fix_lambdas = True
lambda_value = 0.0
reward_vehicle_collision = -5.0
reward_offroad_collision = -5.0
reward_goal = 0.5
obs_partner_noise_speed = 0.0
obs_partner_noise_pos = 0.0
dt = 0.1
async_resets = True
goal_radius = 2.5
; Cruise setpoint in m/s. Stage 1 leaves speed_reward_weight at 0, so this
; value is unused until stage 2 overrides it.
target_speed = 10.0
goal_behavior = 0
goal_target_distance = 30.0
collision_behavior = 0
offroad_behavior = 0
episode_length = 110
resample_frequency = 910
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 50000
init_steps = 0
control_mode = "control_agents"
sdc_controller = "policy"
non_sdc_controller = "policy"
non_vehicle_controller = "auto"
init_mode = "create_all_valid"
max_controlled_agents = 32
render_mode = 1
reg_mode = None
spawn_agents = 0
goal_distance_min = 20.0
goal_distance_max = 50.0

; Switch once, when the logged environment metric reaches the threshold.
; `metric` is the name without the environment/ prefix, for example score.
; After the switch, episode length grows from start to end across the
; remaining training steps. It does not jump at the switch.
[curriculum]
metric = score
threshold = 0.7
episode_length_start = 110
episode_length_end = 600

; Stage 2: four CARLA towns, 128 cars placed on lanes. Every car shares
; target_speed. A destination pays +0.15, then a new point is sampled ahead
; on the lane graph. The episode does not end. Collision and off-road pay
; -0.75 and remove that car. num_agents stays 1024.
[stage2]
map_dir = "data/carla/binaries"
num_maps = 4
spawn_agents = 128
episode_length = 110
goal_behavior = 1
termination_mode = 0
goal_radius = 5.0
goal_distance_min = 20.0
goal_distance_max = 50.0
resample_frequency = 100000
reward_vehicle_collision = -0.75
reward_offroad_collision = -0.75
reward_goal = 0.15
; Shared cruise setpoint in m/s. It is not written into the observation.
target_speed = 10.0
speed_reward_weight = 0.02
speed_reward_sigma = 2.5
accel_penalty = 0.002
terminate_on_failure = 1

[train]
seed = 42
torch_deterministic = True
device = cuda
cpu_offload = False
precision = float32
compile = False
; Same budget as ezmuwiyj. anneal_lr uses this as the cosine length.
total_timesteps = 1_000_000_000
anneal_lr = True
anneal_entropy = False
batch_size = 524288
minibatch_size = 32768
max_minibatch_size = 32768
rollout_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.0001
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.004261385334377629
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 500
optimizer = adam
data_dir = experiments

[eval]
eval_interval = 200
; Stage 1 eval is the logged Waymo task.
map_dir = "resources/drive/binaries/training"
num_eval_agents = 512
self_play_eval = True
human_replay_eval = True
; Once stage 2 is reached, self-play eval uses the Carla towns for this many
; steps. The length stays fixed while training keeps growing its own episodes.
; Human replay stays off: the spawned cars have no logged trajectories.
stage2_map_dir = "data/carla/binaries"
stage2_num_maps = 4
stage2_num_agents = 512
stage2_spawn_agents = 128
stage2_episode_length = 110
stage2_termination_mode = 0
stage2_goal_behavior = 1
stage2_goal_radius = 5.0
stage2_goal_distance_min = 20.0
stage2_goal_distance_max = 50.0
stage2_human_replay_eval = False
render_select_mode = "random"
render_human_replay_eval = True
render_self_play_eval = True
wosac_batch_size = 64
wosac_target_scenarios = 64
wosac_scenario_pool_size = 10000
wosac_max_batches = 100
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_filter_out_post_done = False
wosac_goal_radius = 2.5
wosac_sanity_check = False
wosac_aggregate_results = True
wosac_eval_mode = "policy"
