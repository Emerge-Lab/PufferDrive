; ===========================================================================
; Truck finetune overlay
;
; Usage:
;   torchrun --standalone --nproc_per_node 1 \
;       -m pufferlib.pufferl train puffer_drive \
;       --load-model-path pufferlib/resources/drive/model_puffer_drive_012876.pt \
;       --finetune-config pufferlib/config/ocean/drive_finetune_truck.ini \
;       --policy.input-size 128 \
;       --env.map-dir pufferlib/resources/drive/binaries/Town02 \
;       --wandb --wandb-project pufferdrive --wandb-group ft_truck \
;       --train.data-dir /scratch/ag11023/experiments/ft_truck
;
; Note on --policy.input-size 128:
;   The base .pt was trained with input_size=128 but ships without a sibling
;   config.yaml, so the locking machinery has no way to auto-recover that.
;   Every finetune off the resources/drive/*.pt files needs this flag once.
;   Future finetunes off THIS run's checkpoints won't need it — config.yaml
;   gets saved at training start and the lock kicks in automatically.
; ===========================================================================

[env]
; --- Truck dimensions ---
; Semi-tractor + trailer: ~16m long, ~2.5m wide.
spawn_length_min = 9.0
spawn_length_max = 15.0
spawn_width_min  = 2.0
spawn_width_max  = 2.6
; Mirror in eval so eval metrics measure truck behavior, not car-default.
eval_spawn_length_min = 9.0
eval_spawn_length_max = 15.0
eval_spawn_width_min  = 2.0
eval_spawn_width_max  = 2.6

; --- Reward / goal accommodations for truck dynamics ---
; Trucks have a wider turning radius — loosen the goal-hit threshold.
goal_radius = 4.0
; Lane-alignment is harder for a longer wheelbase; soften the penalty.
reward_lane_align = 0.01

[train]
; Finetunes are typically much shorter than from-scratch runs. 300M ≈ 1-2 hours
; on an H200 at default vec scales. Shrink via CLI --train.total-timesteps for a
; faster first pass.
total_timesteps = 1_000_000_000
checkpoint_interval = 50

; ---------------------------------------------------------------------------
; Disable the in-training behavior_class eval cascade. drive.ini enables 12
; [eval.behaviors_*] sections at interval=100 mode=inline; they all fire on
; the same epoch and each builds a 50-env vecenv loading nuplan maps. On a
; 64GB cgroup the burst at epoch 100 OOM-kills the job. ConfigParser merges
; per-section last-write-wins, so we must override `enabled` on each
; child — flipping `behaviors_defaults.enabled = false` alone doesn't
; cascade because every child writes `enabled = true` explicitly in
; drive.ini.
; Truck finetune doesn't need nuplan-behavior metrics anyway.
; ---------------------------------------------------------------------------
[eval.behaviors_full_dir]
enabled = false
[eval.behaviors_hard_stop]
enabled = false
[eval.behaviors_highway_straight]
enabled = false
[eval.behaviors_lane_change]
enabled = false
[eval.behaviors_merge]
enabled = false
[eval.behaviors_parked_cars]
enabled = false
[eval.behaviors_roundabout]
enabled = false
[eval.behaviors_stopped_traffic]
enabled = false
[eval.behaviors_traffic_light_green]
enabled = false
[eval.behaviors_traffic_light_stop]
enabled = false
[eval.behaviors_unprotected_left]
enabled = false
[eval.behaviors_unprotected_right]
enabled = false

[finetune]
enabled = True
mode = lora
; LoRA only on the shared 4-layer backbone. Encoders + heads stay fully
; trainable so they can adapt to the new dynamics regime end-to-end; the
; ~985k-param backbone is preserved via low-rank adapters so we don't lose
; the original driving prior.
lora_target = "actor_backbone\\.backbone\\."
lora_rank = 32
lora_alpha = 64
lora_lr_mult = 10.0
base_lr = 1e-4
