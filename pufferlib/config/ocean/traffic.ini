[base]
package = ocean
env_name = puffer_traffic
policy_name = Traffic
; Wrap backbone with LSTM so signals remember recent phase history
rnn_name = Recurrent

[vec]
num_envs = 4
num_workers = auto
batch_size = auto

[policy]
; Per-entity encoder embedding dim
input_size = 64
; Shared trunk
backbone_hidden_size = 256
backbone_num_layers = 2
; Actor head (0 = single linear layer after trunk)
actor_hidden_size = 256
actor_num_layers = 0
; Critic head
critic_hidden_size = 256
critic_num_layers = 0

[rnn]
input_size = 256
hidden_size = 256

[env]
; --- Map ---
; Use Town01 (36 TLs across 12 intersections, most regular CARLA map)
map_dir = "pufferlib/resources/drive/binaries/carla_py123d"
num_maps = 1

; --- Simulation ---
scenario_length = 910
; Resample every episode (no mid-episode resample)
resample_frequency = 910
; Stop agents at red lights
traffic_light_behavior = 1
simulation_mode = "gigaflow"

; --- Background vehicles ---
num_bg_agents = 256
min_agents_per_env = 16
max_agents_per_env = 64
; Path to a pretrained Drive checkpoint for frozen background policy.
; Set to None to use random background actions during early training.
bg_policy_path = None

; --- Signal agents ---
; Number of traffic lights per env (36 for Town01, auto-corrected on first reset)
n_tls_per_env = 36

; --- Rewards ---
reward_throughput = 0.5
reward_queue = 0.25
reward_flicker = 1.0

; --- Render (training only, no eval renders) ---
render_mode = None

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 50
anneal_lr = True
batch_size = auto
minibatch_size = 8_192
max_minibatch_size = 8_192
bptt_horizon = 32
learning_rate = 0.0003
gae_lambda = 0.95
gamma = 0.99
ent_coef = 0.01
clip_coef = 0.2
max_grad_norm = 0.5
vf_coef = 0.5
vf_clip_coef = None
update_epochs = 2
normalize_rewards = True
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
vtrace_c_clip = 1
vtrace_rho_clip = 1
ppo_granularity = auto
adv_sampling_prio_alpha = 0.85
adv_sampling_prio_beta0 = 0.85
adv_filter_ewma_beta = 0.25
adv_filter_threshold_scale = 0.01
; Training render (Raylib window, no eval mp4s)
render = False
render_interval = 1000
obs_only = False
show_grid = False
