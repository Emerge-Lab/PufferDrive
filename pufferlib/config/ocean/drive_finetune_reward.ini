; ===========================================================================
; Reward-shaping finetune overlay — goal-heavy preset
;
; Same env as base pretraining (carla_py123d, gigaflow). Just retunes the
; reward weights to favor reaching the goal at the cost of looser safety:
;   reward_goal:               1.0 -> 2.0   (push harder for the goal)
;   reward_velocity:           0.1 -> 0.3   (reward forward progress more)
;   reward_vehicle_collision:  1.0 -> 0.5   (care a bit less about safety)
;   reward_offroad_collision:  1.0 -> 0.5
;
; LoRA on the 4-layer backbone by default. Pair with --evaluator
; validation_gigaflow for one-shot baseline eval (same env as training).
;
; Usage (LoRA):
;   torchrun --standalone --nproc_per_node 1 \
;       -m pufferlib.pufferl train puffer_drive \
;       --load-model-path pufferlib/resources/drive/model_puffer_drive_012876.pt \
;       --finetune-config pufferlib/config/ocean/drive_finetune_reward.ini \
;       --policy.input-size 128 \
;       --wandb --wandb-project finetune_reward --wandb-group ft_reward_goal_heavy \
;       --train.data-dir /scratch/ag11023/experiments/ft_reward_lora
; ===========================================================================

[env]
reward_goal = 2.0
reward_velocity = 0.3
reward_vehicle_collision = 0.5
reward_offroad_collision = 0.5

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 50

[finetune]
enabled = True
mode = lora
lora_target = "actor_backbone\\.backbone\\."
lora_rank = 32
lora_alpha = 64
lora_lr_mult = 10.0
base_lr = 1e-4
