[env]
reward_goal = 2.0
reward_velocity = 0.3
reward_vehicle_collision = 0.5
reward_offroad_collision = 0.5

[train]
total_timesteps = 2_000_000_000
checkpoint_interval = 50

[eval.behaviors_full_dir]
enabled = false
[eval.behaviors_hard_stop]
enabled = false
[eval.behaviors_highway_straight]
enabled = false
[eval.behaviors_lane_change]
enabled = false
[eval.behaviors_merge]
enabled = false
[eval.behaviors_parked_cars]
enabled = false
[eval.behaviors_roundabout]
enabled = false
[eval.behaviors_stopped_traffic]
enabled = false
[eval.behaviors_traffic_light_green]
enabled = false
[eval.behaviors_traffic_light_stop]
enabled = false
[eval.behaviors_unprotected_left]
enabled = false
[eval.behaviors_unprotected_right]
enabled = false

[finetune]
enabled = True
mode = lora
lora_target = "actor_backbone\\.backbone\\."
lora_rank = 32
lora_alpha = 64
lora_lr_mult = 10.0
base_lr = 1e-4
