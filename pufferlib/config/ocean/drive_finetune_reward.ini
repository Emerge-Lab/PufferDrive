; ===========================================================================
; Reward-shaping finetune overlay — goal-heavy preset
;
; Same env as base pretraining (carla_py123d, gigaflow). Just retunes the
; reward weights to favor reaching the goal at the cost of looser safety:
;   reward_goal:               1.0 -> 2.0   (push harder for the goal)
;   reward_velocity:           0.1 -> 0.3   (reward forward progress more)
;   reward_vehicle_collision:  1.0 -> 0.5   (care a bit less about safety)
;   reward_offroad_collision:  1.0 -> 0.5
;
; LoRA on the 4-layer backbone by default. Pair with --evaluator
; validation_gigaflow for one-shot baseline eval (same env as training).
;
; Usage (LoRA):
;   torchrun --standalone --nproc_per_node 1 \
;       -m pufferlib.pufferl train puffer_drive \
;       --load-model-path pufferlib/resources/drive/model_puffer_drive_012876.pt \
;       --finetune-config pufferlib/config/ocean/drive_finetune_reward.ini \
;       --policy.input-size 128 \
;       --wandb --wandb-project finetune_reward --wandb-group ft_reward_goal_heavy \
;       --train.data-dir /scratch/ag11023/experiments/ft_reward_lora
; ===========================================================================

[env]
reward_goal = 2.0
reward_velocity = 0.3
reward_vehicle_collision = 0.5
reward_offroad_collision = 0.5

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 50

; ---------------------------------------------------------------------------
; Disable the in-training behavior_class eval cascade. drive.ini enables 12
; [eval.behaviors_*] sections at interval=100 mode=inline; they all fire on
; the same epoch and each builds a 50-env vecenv loading nuplan maps. On a
; 64GB cgroup the burst at epoch 100 OOM-kills the job. ConfigParser merges
; per-section last-write-wins, so we must override `enabled` on each
; child — flipping `behaviors_defaults.enabled = false` alone doesn't
; cascade because every child writes `enabled = true` explicitly in
; drive.ini.
; Reward-shaping finetune doesn't need nuplan-behavior metrics; pair with
; --evaluator validation_gigaflow for in-distribution eval.
; ---------------------------------------------------------------------------
[eval.behaviors_full_dir]
enabled = false
[eval.behaviors_hard_stop]
enabled = false
[eval.behaviors_highway_straight]
enabled = false
[eval.behaviors_lane_change]
enabled = false
[eval.behaviors_merge]
enabled = false
[eval.behaviors_parked_cars]
enabled = false
[eval.behaviors_roundabout]
enabled = false
[eval.behaviors_stopped_traffic]
enabled = false
[eval.behaviors_traffic_light_green]
enabled = false
[eval.behaviors_traffic_light_stop]
enabled = false
[eval.behaviors_unprotected_left]
enabled = false
[eval.behaviors_unprotected_right]
enabled = false

[finetune]
enabled = True
mode = lora
lora_target = "actor_backbone\\.backbone\\."
lora_rank = 32
lora_alpha = 64
lora_lr_mult = 10.0
base_lr = 1e-4
