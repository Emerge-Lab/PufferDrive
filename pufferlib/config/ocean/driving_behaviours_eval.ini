; Configuration for driving behaviour evaluation using nuPlan Mini classified scenarios.
; Evaluates 6 driving behaviour classes:
;   highway straight, lane change, traffic light (green), traffic light (stop),
;   unprotected left turn, protected right turn.
; Each class section sets the map_dir. num_agents is set automatically from the
; number of .bin files in the directory.
; Eval runs in REPLAY mode (simulation_mode=replay, control_mode=control_sdc_only)
; using the same reward weights as training (no reward conditioning).
; scenario_length = 101 steps at dt=0.1 (10 seconds).

[eval_highway_straight]
map_dir = "pufferlib/resources/drive/binaries/nuplan_mini_bins_classified/highway_straight"
scenario_length = 101

[eval_lane_change]
map_dir = "pufferlib/resources/drive/binaries/nuplan_mini_bins_classified/lane_change"
scenario_length = 101

[eval_traffic_light_green]
map_dir = "pufferlib/resources/drive/binaries/nuplan_mini_bins_classified/traffic_light_green"
scenario_length = 101

[eval_traffic_light_stop]
map_dir = "pufferlib/resources/drive/binaries/nuplan_mini_bins_classified/traffic_light_stop"
scenario_length = 101

[eval_unprotected_left]
map_dir = "pufferlib/resources/drive/binaries/nuplan_mini_bins_classified/unprotected_left"
scenario_length = 101

[eval_protected_right]
map_dir = "pufferlib/resources/drive/binaries/nuplan_mini_bins_classified/protected_right"
scenario_length = 101
