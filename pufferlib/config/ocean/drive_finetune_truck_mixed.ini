[env]
; --- Mixed population: 20% trucks at spawn, rest sample the default car range ---
truck_fraction = 0.2
truck_spawn_length_min = 9.0
truck_spawn_length_max = 15.0
truck_spawn_width_min  = 2.0
truck_spawn_width_max  = 2.6

goal_radius = 4.0
reward_lane_align = 0.01

[train]
total_timesteps = 2_000_000_000
checkpoint_interval = 50

[eval.behaviors_full_dir]
enabled = false
[eval.behaviors_hard_stop]
enabled = false
[eval.behaviors_highway_straight]
enabled = false
[eval.behaviors_lane_change]
enabled = false
[eval.behaviors_merge]
enabled = false
[eval.behaviors_parked_cars]
enabled = false
[eval.behaviors_roundabout]
enabled = false
[eval.behaviors_stopped_traffic]
enabled = false
[eval.behaviors_traffic_light_green]
enabled = false
[eval.behaviors_traffic_light_stop]
enabled = false
[eval.behaviors_unprotected_left]
enabled = false
[eval.behaviors_unprotected_right]
enabled = false

[finetune]
enabled = True
mode = full
base_lr = 1e-4
