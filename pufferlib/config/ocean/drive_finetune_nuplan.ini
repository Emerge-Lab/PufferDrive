[env]
; --- nuPlan training data (replay-mode rollouts of real traffic logs) ---
map_dir = "/scratch/ev2237/data/nuplan/nuplan_mini_train_bins"
num_maps = 200
simulation_mode = "replay"
control_mode = "control_sdc_only"
init_mode = "create_all_valid"
; nuPlan log length is ~20s at 10Hz = 200 steps. +1 to match behavior eval sections.
scenario_length = 201
resample_frequency = 201
; SDC is the only controlled agent; the "too many inactive agents" early-reset
; trigger doesn't apply here. Use scenario-length termination.
termination_mode = 0

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 50

[eval.behaviors_full_dir]
enabled = false
[eval.behaviors_hard_stop]
enabled = false
[eval.behaviors_highway_straight]
enabled = false
[eval.behaviors_lane_change]
enabled = false
[eval.behaviors_merge]
enabled = false
[eval.behaviors_parked_cars]
enabled = false
[eval.behaviors_roundabout]
enabled = false
[eval.behaviors_stopped_traffic]
enabled = false
[eval.behaviors_traffic_light_green]
enabled = false
[eval.behaviors_traffic_light_stop]
enabled = false
[eval.behaviors_unprotected_left]
enabled = false
[eval.behaviors_unprotected_right]
enabled = false

[finetune]
enabled = True
mode = lora
; LoRA only on the shared 4-layer backbone — encoders + heads stay fully
; trainable so they can adapt to replay-style observations end-to-end.
lora_target = "actor_backbone\\.backbone\\."
lora_rank = 32
lora_alpha = 64
lora_lr_mult = 10.0
base_lr = 1e-4
