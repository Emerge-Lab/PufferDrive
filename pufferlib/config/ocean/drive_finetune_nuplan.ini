; ===========================================================================
; nuPlan finetune overlay
;
; Adapts the base gigaflow-trained policy to nuPlan replay scenarios:
;   - SDC-only control over real traffic logs
;   - ~200 step (~20 s @ 10 Hz) episodes
;   - LoRA on the 4-layer backbone by default
;
; Pair with --evaluator behaviors_full_dir for one-shot baseline eval
; (validation_gigaflow won't reflect replay-task performance — it forces
; gigaflow sim on carla maps via its own env overrides).
;
; Usage (LoRA):
;   torchrun --standalone --nproc_per_node 1 \
;       -m pufferlib.pufferl train puffer_drive \
;       --load-model-path pufferlib/resources/drive/model_puffer_drive_012876.pt \
;       --finetune-config pufferlib/config/ocean/drive_finetune_nuplan.ini \
;       --policy.input-size 128 \
;       --wandb --wandb-project finetune_nuplan --wandb-group ft_nuplan \
;       --train.data-dir /scratch/ag11023/experiments/ft_nuplan_lora
; ===========================================================================

[env]
; --- nuPlan training data (replay-mode rollouts of real traffic logs) ---
map_dir = "/scratch/ev2237/data/nuplan/nuplan_mini_train_bins"
num_maps = 200
simulation_mode = "replay"
control_mode = "control_sdc_only"
init_mode = "create_all_valid"
; nuPlan log length is ~20s at 10Hz = 200 steps. +1 to match behavior eval sections.
scenario_length = 201
resample_frequency = 201
; SDC is the only controlled agent; the "too many inactive agents" early-reset
; trigger doesn't apply here. Use scenario-length termination.
termination_mode = 0

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 50

; ---------------------------------------------------------------------------
; Disable the in-training behavior_class eval cascade. drive.ini enables 12
; [eval.behaviors_*] sections at interval=100 mode=inline; they all fire on
; the same epoch and each builds a 50-env vecenv loading nuplan maps. On a
; 64GB cgroup the burst at epoch 100 OOM-kills the job. ConfigParser merges
; per-section last-write-wins, so we must override `enabled` on each
; child — flipping `behaviors_defaults.enabled = false` alone doesn't
; cascade because every child writes `enabled = true` explicitly in
; drive.ini.
; For nuPlan finetune: re-enable a *single* category here (or
; behaviors_full_dir) if you need in-training tracking. Running all 12
; sequentially is what blows past --mem; one is fine.
; ---------------------------------------------------------------------------
[eval.behaviors_full_dir]
enabled = false
[eval.behaviors_hard_stop]
enabled = false
[eval.behaviors_highway_straight]
enabled = false
[eval.behaviors_lane_change]
enabled = false
[eval.behaviors_merge]
enabled = false
[eval.behaviors_parked_cars]
enabled = false
[eval.behaviors_roundabout]
enabled = false
[eval.behaviors_stopped_traffic]
enabled = false
[eval.behaviors_traffic_light_green]
enabled = false
[eval.behaviors_traffic_light_stop]
enabled = false
[eval.behaviors_unprotected_left]
enabled = false
[eval.behaviors_unprotected_right]
enabled = false

[finetune]
enabled = True
mode = lora
; LoRA only on the shared 4-layer backbone — encoders + heads stay fully
; trainable so they can adapt to replay-style observations end-to-end.
lora_target = "actor_backbone\\.backbone\\."
lora_rank = 32
lora_alpha = 64
lora_lr_mult = 10.0
base_lr = 1e-4
