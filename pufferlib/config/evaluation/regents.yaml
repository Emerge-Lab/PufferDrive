# Offline ReGentS adversary generation. Drive is instantiated directly: this path
# never initializes PPO, a policy optimizer, a rollout buffer, or training logging.
env:
  simulation_mode: replay
  eval_mode: true
  compute_eval_metrics: true
  control_mode: control_sdc_only
  sdc_controller: idm
  non_sdc_controller: replay
  non_vehicle_controller: replay
  collision_behavior: ignore
  action_type: continuous
  dynamics_model: classic
  dt: 0.1
  scenario_length: 200
  resample_frequency: 200
  num_agents: 1
  min_agents_per_env: 1
  max_agents_per_env: 1
  num_eval_scenarios: 1
  max_scenarios_per_batch: 1
  init_step: 0
  init_step_spread: false
  reward_conditioning: false
  reward_randomization: false
  terminate_on_goal: false
  goal_source: route
  map_dir: pufferlib/resources/drive/binaries/nuplan
  use_neighbor_cache: 0
  use_map_cache: 0

generations:
  # The Stage 3 audit scenarios: the first 16 local NuPlan maps with seeds 42..57.
  - name: regents_nuplan
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 100
    maximum_outer_iterations: 1
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      filter:
        # NuPlan parked tracks can have >0.2 m of position jitter at exactly zero speed.
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: replay

  # WOD Motion validation logs contain 91 states, hence a full 90-transition
  # horizon. Keep the default cohort bounded to the first 250 sorted binaries.
  - name: regents_wod_motion_val
    seed: 42
    scenario_count: 250
    num_workers: 24
    horizon_transition_count: 90
    maximum_outer_iterations: 1
    raster_resolution_meters: 1.0
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.005
      iteration_count: 500
      filter:
        static_speed_threshold_mps: 0.2
        # Reject the upper reconstruction tail: 93.3% of WOD candidates stay
        # within 1 m, retaining 244/246 pre-gate candidate-bearing scenes.
        maximum_reconstruction_drift_meters: 1.0
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: replay
      # WOD candidate tracks reach 25 m/s at p99 and the cohort holds a few
      # implausible >40 m/s tracks; clamping a logged speed corrupts its
      # reconstruction, so keep the cap above real traffic.
      base_max_speed_mps: 40.0

  # Full 20 s NuPlan window: 200 transitions at dt=0.1. scenario_length and
  # resample_frequency sit one step above the horizon so neither guard trips.
  - name: regents_nuplan_20s
    seed: 42
    scenario_count: 16
    num_workers: 16
    horizon_transition_count: 200
    maximum_outer_iterations: 3
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      filter:
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 201
      resample_frequency: 201

  - name: regents_nuplan_smoke
    seed: 42
    scenario_count: 2
    num_workers: 1
    horizon_transition_count: 50
    maximum_outer_iterations: 2
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 20
      filter:
        static_speed_threshold_mps: 0.2
