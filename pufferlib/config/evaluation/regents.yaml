# Offline ReGentS adversary generation. Drive is instantiated directly: this path
# never initializes PPO, a policy optimizer, a rollout buffer, or training logging.
env:
  simulation_mode: replay
  eval_mode: true
  compute_eval_metrics: true
  control_mode: control_sdc_only
  sdc_controller: idm
  # Reactive background traffic for every generation in this file. An installed ReGentS
  # plan takes priority over it, so only the unselected vehicles are driven by IDM.
  non_sdc_controller: idm
  non_vehicle_controller: replay
  collision_behavior: ignore
  # ReGentS scenes have no adv3.0 "adversary", so the default
  # target_inactive_or_no_nearby_adversary mode ends the episode on the first step and
  # freezes the C replay it verifies against.
  adversarial_termination_mode: disabled
  # The adv3.0 default removes the target on its first infraction, so an ego that clips a
  # kerb disappears before the adversary can reach it and no ego collision is ever recorded.
  target_infraction_behavior: normal
  action_type: continuous
  dynamics_model: classic
  dt: 0.1
  scenario_length: 200
  resample_frequency: 200
  num_agents: 1
  min_agents_per_env: 1
  max_agents_per_env: 1
  num_eval_scenarios: 1
  max_scenarios_per_batch: 1
  init_step: 0
  init_step_spread: false
  reward_conditioning: false
  reward_randomization: false
  terminate_on_goal: false
  goal_source: route
  # Pin the PDM planning resolution. ReGentS builds its env from Drive.__init__ defaults
  # (generation.py `_full_env_config`), not puffer_drive.yaml, so without this the pipeline
  # would silently plan at the 0.5 s Python default while `puffer eval` uses 0.1.
  pdm_horizon: 4.0
  pdm_planning_dt: 0.1
  map_dir: pufferlib/resources/drive/binaries/nuplan
  use_neighbor_cache: 0
  use_map_cache: 0
  # Records the braking counterfactual so the replay HTML can show the avoidability panel.
  capture_avoidability_debug: true

# Standard generation settings. Python applies a selected generation on top of these
# values, matching the base-env then benchmark-env precedence used by `puffer eval`.
raster_resolution_meters: 1.0
optimizer:
  # Disable rear exclusion and divergent steering cancellation for the comparison mode.
  use_regents: true
  # Adam displaces a parameter by about the learning rate per iteration, so their
  # product is the action-space budget.
  learning_rate: 0.001
  iteration_count: 500
  # Reactive egos answer every update. Replay egos coerce this to zero because a
  # refresh would only reproduce the same logged trajectory.
  ego_refresh_interval: 1
  filter:
    static_speed_threshold_mps: 0.2
    maximum_reconstruction_drift_meters: 1.0

# Shared cost geometry for every generation; a generation's own optimizer.costs
# overrides these key by key. The 0.25 m sigma is selected from the 100-scenario
# WOD Motion PDM sweep; truncation remains 6.4 sigma.
costs:
  gaussian_sigma_meters: 0.25
  gaussian_truncate_sigma: 6.4

generations:
  - name: regents_wod_motion_val_idm
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 90
    output_dir: experiments/regents
    render_replays: true
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: idm
      base_max_speed_mps: 40.0

  - name: regents_wod_motion_val_pdm
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 90
    output_dir: experiments/regents
    render_replays: true
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: pdm
      base_max_speed_mps: 40.0

  - name: regents_carla_generated_policy
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 100
    output_dir: experiments/regents
    render_replays: true
    env:
      map_dir: pufferlib/resources/drive/binaries/carla_generated_policy_clean_1000
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: pdm

  - name: regents_wod_motion_val_policy
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 90
    output_dir: experiments/regents
    render_replays: true
    # Record the ego observation alongside each HTML frame, so a replay shows what the
    # policy actually saw. Off by default: it is the policy profiles that need it.
    capture_observations: true
    ego_policy:
      checkpoint_path: experiments/3_0_no_conditionning_target.pt
      config_path: experiments/3_0_no_conditionning_target_config.yaml
      action_selection: mean
      device: cpu
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: policy
      # The checkpoint's 12-class head is jerk; injected adversaries stay classic.
      dynamics_model: jerk
      base_max_speed_mps: 40.0
      obs_dropout_lane: 0.0
      obs_dropout_boundary: 0.0
      partner_blindness_prob: 0.0
      partner_blindness_trigger_prob: 0.0
      phantom_braking_prob: 0.0
      phantom_braking_trigger_prob: 0.0


  # The ego is the checkpoint that generated the cohort, so this attacks the policy on its
  # own clean driving. dynamics_model is jerk because that is what the 12-class action head
  # was trained on; injected adversaries still integrate the classic bicycle model. The
  # erratic-driver and observation-dropout knobs are zeroed so the ego stays deterministic
  # and on-distribution.
  - name: regents_carla_generated_policy_10k_policy
    seed: 42
    scenario_count: 10000
    num_workers: 24
    horizon_transition_count: 100
    output_dir: experiments/regents
    render_replays: false
    ego_policy:
      checkpoint_path: experiments/3_0_no_conditionning_target.pt
      config_path: experiments/3_0_no_conditionning_target_config.yaml
      action_selection: mean
      device: cpu
    env:
      map_dir: pufferlib/resources/drive/binaries/carla_generated_policy_10k_100_seed_4
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: policy
      dynamics_model: jerk
      obs_dropout_lane: 0.0
      obs_dropout_boundary: 0.0
      partner_blindness_prob: 0.0
      partner_blindness_trigger_prob: 0.0
      phantom_braking_prob: 0.0
      phantom_braking_trigger_prob: 0.0
