# Offline ReGentS adversary generation. Drive is instantiated directly: this path
# never initializes PPO, a policy optimizer, a rollout buffer, or training logging.
env:
  simulation_mode: replay
  eval_mode: true
  compute_eval_metrics: true
  control_mode: control_sdc_only
  sdc_controller: idm
  non_sdc_controller: replay
  non_vehicle_controller: replay
  collision_behavior: ignore
  action_type: continuous
  dynamics_model: classic
  dt: 0.1
  scenario_length: 200
  resample_frequency: 200
  num_agents: 1
  min_agents_per_env: 1
  max_agents_per_env: 1
  num_eval_scenarios: 1
  max_scenarios_per_batch: 1
  init_step: 0
  init_step_spread: false
  reward_conditioning: false
  reward_randomization: false
  terminate_on_goal: false
  goal_source: route
  map_dir: pufferlib/resources/drive/binaries/nuplan
  use_neighbor_cache: 0
  use_map_cache: 0

generations:
  # The Stage 3 audit scenarios: the first 16 local NuPlan maps with seeds 42..57.
  - name: regents_nuplan
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 100
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      # The ego is log replay here, so it cannot answer the adversary. Every profile asks for
      # a refresh per update; for a replay ego `run_reactive_generation` coerces this to 0,
      # because a refresh would only re-derive the trajectory already captured.
      ego_refresh_interval: 1
      filter:
        # NuPlan parked tracks can have >0.2 m of position jitter at exactly zero speed.
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: replay

  # WOD Motion validation logs contain 91 states, hence a full 90-transition
  # horizon. Keep the default cohort bounded to the first 250 sorted binaries.
  - name: regents_wod_motion_val
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 90
    raster_resolution_meters: 1.0
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.005
      iteration_count: 500
      # A reactive IDM ego answers each iterate before a contact is allowed to end the
      # run, so stopping on the first contact means stopping on an IDM-confirmed one.
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
        # Reject the upper reconstruction tail: 93.3% of WOD candidates stay
        # within 1 m, retaining 244/246 pre-gate candidate-bearing scenes.
        maximum_reconstruction_drift_meters: 1.0
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: idm
      # WOD candidate tracks reach 25 m/s at p99 and the cohort holds a few
      # implausible >40 m/s tracks; clamping a logged speed corrupts its
      # reconstruction, so keep the cap above real traffic.
      base_max_speed_mps: 40.0

  # WOD Motion validation against a PDM ego. Horizon, raster, learning rate, filters, and
  # speed cap follow regents_wod_motion_val; only the ego differs. Note this is the profile
  # that drives PDM's rollout buffer to its limit: base_max_speed_mps 40.0 puts a fast ego at
  # the speed-aware horizon cap of 8 s, which at pdm_planning_dt 0.1 is exactly the 81 steps
  # PDM_MAX_ROLLOUT_STEPS allows. Raising the cap or lowering pdm_planning_dt needs that
  # constant raised with it.
  - name: regents_wod_motion_val_pdm
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 90
    raster_resolution_meters: 1.0
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.005
      iteration_count: 500
      # A reactive PDM ego answers each iterate before a contact is allowed to end the
      # run, so stopping on the first contact means stopping on a PDM-confirmed one.
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
        maximum_reconstruction_drift_meters: 1.0
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: pdm
      base_max_speed_mps: 40.0

  # WOD Motion validation against the learned ego. Horizon, raster, learning rate,
  # filters, and speed cap follow regents_wod_motion_val; only the ego differs.
  - name: regents_wod_motion_val_policy
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 90
    raster_resolution_meters: 1.0
    output_dir: experiments/regents
    render_replays: true
    # Record the ego observation alongside each HTML frame, so a replay shows what the
    # policy actually saw. Off by default: it is the policy profiles that need it.
    capture_observations: true
    ego_policy:
      checkpoint_path: experiments/3_0_no_conditionning_target.pt
      config_path: experiments/3_0_no_conditionning_target_config.yaml
      action_selection: mean
      device: cpu
    optimizer:
      learning_rate: 0.005
      iteration_count: 500
      # A policy refresh is 90 C steps plus 90 forward passes, so this is the dominant
      # per-scenario cost: up to 45k inferences. Accepted deliberately, so the adversary is
      # always optimized against an ego that has answered it.
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
        maximum_reconstruction_drift_meters: 1.0
    env:
      map_dir: pufferlib/resources/drive/binaries/wod-motion_val
      scenario_length: 91
      resample_frequency: 91
      sdc_controller: policy
      # The checkpoint's 12-class head is jerk; injected adversaries stay classic.
      dynamics_model: jerk
      base_max_speed_mps: 40.0
      obs_dropout_lane: 0.0
      obs_dropout_boundary: 0.0
      partner_blindness_prob: 0.0
      partner_blindness_trigger_prob: 0.0
      phantom_braking_prob: 0.0
      phantom_braking_trigger_prob: 0.0

  # Full 20 s NuPlan window: 200 transitions at dt=0.1. scenario_length and
  # resample_frequency sit one step above the horizon so neither guard trips.
  - name: regents_nuplan_20s
    seed: 42
    scenario_count: 16
    num_workers: 16
    horizon_transition_count: 200
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      # IDM ego: re-rolled in C on every update, so the adversary is always optimized
      # against an ego that answers it.
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 201
      resample_frequency: 201

  # Adversaries targeted at a learned ego. The env dynamics model is jerk because that is
  # what the checkpoint's 12-class action head was trained on; injected adversaries still
  # integrate the classic bicycle model, so C/Torch parity is unchanged. The erratic-driver
  # and observation-dropout knobs are zeroed here only: they default non-zero for training,
  # and an ego that reads observations must be deterministic and on-distribution.
  - name: regents_nuplan_policy
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 100
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    ego_policy:
      checkpoint_path: experiments/3_0_no_conditionning_target.pt
      config_path: experiments/3_0_no_conditionning_target_config.yaml
      action_selection: mean
      device: cpu
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      # A policy refresh costs a full C rollout plus one forward pass per step, so this is
      # the dominant per-scenario cost. Accepted deliberately for maximum ego reactivity.
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: policy
      dynamics_model: jerk
      obs_dropout_lane: 0.0
      obs_dropout_boundary: 0.0
      partner_blindness_prob: 0.0
      partner_blindness_trigger_prob: 0.0
      phantom_braking_prob: 0.0
      phantom_braking_trigger_prob: 0.0

  # NuPlan against a corridor-IDM ego. Same cost profile as the IDM ego (one corridor
  # leader scan per step), so the ego answers every iterate.
  - name: regents_nuplan_corridor_idm
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 100
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: corridor_idm

  # NuPlan against a PDM ego, re-rolled on every update so the adversary is always optimized
  # against an ego that has answered it. PDM scores 15 candidate manoeuvres per agent per step,
  # so this is the most expensive profile here by a wide margin; drop the interval if the cost
  # outweighs the reactivity. Expect a lower success rate than the IDM profiles: PDM brakes and
  # offsets to evade, so some scenes legitimately end in iteration_limit rather than a collision.
  - name: regents_nuplan_pdm
    seed: 42
    scenario_count: 100
    num_workers: 24
    horizon_transition_count: 100
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
    env:
      scenario_length: 101
      resample_frequency: 101
      sdc_controller: pdm

  - name: regents_nuplan_smoke
    seed: 42
    scenario_count: 2
    num_workers: 1
    horizon_transition_count: 50
    raster_resolution_meters: 0.5
    output_dir: experiments/regents
    render_replays: true
    optimizer:
      learning_rate: 0.001
      iteration_count: 500
      # One ego rollout per update: 500 updates is up to 500 ego trajectories.
      ego_refresh_interval: 1
      filter:
        static_speed_threshold_mps: 0.2
