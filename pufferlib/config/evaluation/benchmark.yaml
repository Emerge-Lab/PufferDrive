env:
  eval_mode: true
  compute_eval_metrics: true
  collision_behavior: stop
  offroad_behavior: stop
  traffic_light_behavior: stop
  dt: 0.1
  reward_randomization: false
  reward_collision: 3.0
  reward_offroad: 3.0
  reward_stop_line: 1.0
  reward_ade: 0.0
  reward_goal: 1.0
  reward_overspeed: 0.05
  reward_comfort: 0.05
  reward_velocity: 0.0025
  reward_lane_align: 0.025
  reward_lane_center: 0.0038
  reward_timestep: 0.000025
  reward_reverse: 0.005
  goal_speed: 20.0
  goal_source: "route"
  goal_radius: 2.0
  goal_regen_mode: "finite"
  min_goal_spacing: 30.0
  max_goal_spacing: 30.0
  obs_dropout_lane: 0.0
  obs_dropout_boundary: 0.0
  partner_blindness_prob: 0.0
  partner_blindness_trigger_prob: 0.0
  phantom_braking_prob: 0.0
  phantom_braking_trigger_prob: 0.0
  termination_mode: 0

benchmarks:
  - name: carla
    seed: 42
    simulation_mode: gigaflow
    num_scenarios: 1000
    num_maps: 8
    max_agents_per_env: 50
    scenario_length: 6000
    control_mode: control_vehicles
    map_dir: pufferlib/resources/drive/binaries/carla

  - name: carla_fast
    seed: 42
    simulation_mode: gigaflow
    num_scenarios: 250
    num_maps: 8
    max_agents_per_env: 50
    scenario_length: 500
    control_mode: control_vehicles
    map_dir: pufferlib/resources/drive/binaries/carla

  - name: womd_multi
    seed: 42
    simulation_mode: replay
    num_scenarios: 1000
    num_maps: 1000
    max_agents_per_env: 128
    scenario_length: 91
    control_mode: control_vehicles
    map_dir: pufferlib/resources/drive/binaries/wod-motion_val

  - name: womd_single
    seed: 42
    simulation_mode: replay
    num_scenarios: 1000
    num_maps: 1000
    max_agents_per_env: null
    scenario_length: 91
    control_mode: control_sdc_only
    map_dir: pufferlib/resources/drive/binaries/wod-motion_val

  - name: nuplan_multi
    seed: 42
    simulation_mode: replay
    num_scenarios: 1000
    num_maps: 1000
    max_agents_per_env: 300
    scenario_length: 200
    control_mode: control_vehicles
    map_dir: pufferlib/resources/drive/binaries/nuplan

  - name: nuplan_single
    seed: 42
    simulation_mode: replay
    num_scenarios: 1000
    num_maps: 1000
    max_agents_per_env: null
    scenario_length: 200
    control_mode: control_sdc_only
    map_dir: pufferlib/resources/drive/binaries/nuplan

  # Closed-loop co-sim against the real external simulators (see
  # pufferlib/ocean/evaluation_utils/cosim_evaluator.py), unlike the two
  # benchmarks above which replay pre-baked .bin maps in-process.
  - name: carla_cosim
    simulation_mode: carla_cosim
    route_ids: [0, 1, 2]
    base_carla_port: 2000
    compute_config: scripts/cluster_configs/nyu_greene.yaml

  - name: nuplan_cosim
    simulation_mode: nuplan_cosim
    scenario_filters: [nuplan_shard_00]
    challenges:
      - closed_loop_nonreactive_agents_pufferdrive
      - closed_loop_reactive_agents_pufferdrive
    # ray_distributed (the devkit's default) sizes its worker pool from the
    # node's total CPU count, not this job's actual allocation, and OOMed on
    # the debug run (2026-08-14) -- see run_nuplan_planner.sh's own header.
    worker: sequential
    compute_config: scripts/cluster_configs/nyu_greene.yaml
