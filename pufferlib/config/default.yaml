# Monolithic config for `puffer <mode> default` — Hydra migration phase 1.
# Generated by scripts/convert_ini_to_yaml.py from pufferlib/config/default.ini
# (merged over pufferlib/config/default.ini). Override at the CLI with
# Hydra syntax: train.learning_rate=1e-4 env.num_agents=512 wandb=true
load_model_path: null
load_id: null
render_mode: auto
video_path: videos
num_scenarios: 3
render: 0
agent_index: null
save_frames: 0
gif_path: eval.gif
fps: 15
max_runs: 200
wandb: false
wandb_project: pufferlib
wandb_group: debug
run_name: null
neptune: false
neptune_name: pufferai
neptune_project: ablations
tb: false
local_rank: 0
tag: null
eval_simulation: null
package: null
env_name: null
policy_name: Policy
rnn_name: null
max_suggestion_cost: 3600

vec:
  backend: Multiprocessing
  num_envs: 2
  num_workers: auto
  batch_size: auto
  zero_copy: true
  seed: 42

train:
  name: pufferai
  project: ablations
  seed: 42
  torch_deterministic: false
  cpu_offload: false
  device: cuda
  optimizer: adamw
  anneal_lr: true
  amp: true
  precision: float32
  total_timesteps: 10000000
  learning_rate: 0.015
  gamma: 0.995
  gae_lambda: 0.9
  update_epochs: 1
  clip_coef: 0.2
  vf_coef: 2.0
  vf_clip_coef: 0.2
  max_grad_norm: 1.5
  normalize_rewards: true
  ent_coef: 0.001
  adam_beta1: 0.95
  adam_beta2: 0.999
  adam_eps: 1.0e-12
  data_dir: experiments
  resume_state_path: null
  checkpoint_interval: 200
  batch_size: auto
  minibatch_size: 8192

  # Accumulate gradients above this size
  max_minibatch_size: 32768
  bptt_horizon: 64
  compile: false
  compile_mode: default
  compile_fullgraph: false
  vtrace_rho_clip: 1.0
  vtrace_c_clip: 1.0
  adv_sampling_prio_alpha: 0.8
  adv_sampling_prio_beta0: 0.2

sweep:
  method: Protein
  metric: score
  goal: maximize
  downsample: 10
