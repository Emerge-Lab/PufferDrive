load_model_path: null
load_id: null
render_mode: auto
video_path: videos
num_scenarios: 3
render: 0
agent_index: null
save_frames: 0
gif_path: eval.gif
fps: 15
max_runs: 200
wandb: false
wandb_project: pufferlib
wandb_group: debug
# Unique run identifier. Doubles as the logger run id, so relaunching with the
# same run_name and train.data_dir resumes that run instead of starting a new one.
run_name: default_run
neptune: false
neptune_name: pufferai
neptune_project: ablations
tb: false
local_rank: 0
tag: null
eval_simulation: null
package: ocean
env_name: puffer_drive
policy_name: Drive
# Options: Recurrent, None (null)
rnn_name: null
max_suggestion_cost: 3600
vec:
  backend: Multiprocessing
  num_envs: 20
  num_workers: auto
  batch_size: auto
  zero_copy: true
  seed: 42
env:
  # --- Simulation ---
  # Options: "gigaflow", "replay"
  simulation_mode: gigaflow
  # Total number of agents in the environments
  num_agents: 1024
  # GIGAFLOW-specific: minimum/maximum number of agents per environment
  min_agents_per_env: 1
  max_agents_per_env: 150
  # Actions type - options: "discrete", "continuous"
  action_type: continuous
  # Dynamics model - options: "classic", "jerk"
  dynamics_model: jerk
  # Jerk dynamics: Zero both accelerations when velocity crosses zero
  reset_accel_on_stop: true
  # Time delta between steps in seconds
  dt: 0.3
  # Base forward speed cap
  base_max_speed_mps: 20.0
  # Speed cap when reward_randomization is off (eval); null = base_max_speed_mps. Sets C_vel = max_speed_mps / base_max_speed_mps (training range [0.667, 1.5] -> [13.3, 30] m/s)
  max_speed_mps: null
  # Optional nonzero launch speed for gigaflow random spawns
  spawn_initial_speed: 0.0
  # Gigaflow spawn pose noise: lateral offset as a fraction of half the lane width, heading offset in degrees
  spawn_lateral_offset_max_frac: 1.0
  spawn_heading_max_deg: 30.0
  # Gigaflow dynamics randomization: per-step brownian pose buffeting (std in meters / degrees); 0 disables
  pose_noise_xy_m: 0.0
  pose_noise_yaw_deg: 0.0
  # Collision behavior - options: "ignore", "stop", "remove"
  collision_behavior: stop
  # Offroad behavior - options: "ignore", "stop", "remove"
  offroad_behavior: stop
  # Traffic light behavior - options: "ignore", "stop", "remove"
  traffic_light_behavior: stop
  # Skip red light violation detection (metrics, reward, behavior) - 0 off, 1 on
  disable_red_light_infractions: 0
  # Cycle the lights of a junction phase-by-phase (TLPHASE1 bins) - 0 independent lights (legacy), 1 on
  traffic_light_junction_phases: 0
  # Share static map geometry (roads/grid/lane-graph) across envs using the same map - 0 off, 1 on
  use_map_cache: 1
  # Precompute neighboring road entities for observation queries - 0 off, 1 on
  use_neighbor_cache: 1
  # Number of steps before reset; keep it off multiples of train.bptt_horizon so episode ends don't all land on the unused last buffer slot
  scenario_length: 2500
  # Frequency of resampling scenario (in steps), 0 to disable
  resample_frequency: 256000
  # End of episode - options: 0 - scenario_length, 1 - early reset when too many agents are removed
  termination_mode: 1
  # Ratio of inactive agents (stopped/removed) that triggers early reset (used when termination_mode = 1)
  inactive_agent_threshold: 0.4
  # End the episode as soon as the agent reaches its final goal. Only active in
  # control_sdc_only replay mode (single active agent).
  terminate_on_goal: 0
  # Determines which step of the trajectory to initialize the agents at upon reset
  init_step: 0
  # allows to initiate the C environment at random init points - works in replay mode only:
  init_step_spread: false
  # sets an upper bound on the random init step
  # the sampled init step can be at most this close to the end of the episode;
  init_step_min_horizon: 20
  # options: "control_vehicles", "control_agents", "control_tracks_to_predict", "control_sdc_only"
  control_mode: control_vehicles
  # Controller used by agent 0, the canonical SDC/target.
  # options: "static", "policy", "replay", "idm"
  sdc_controller: policy
  # Controller used by non-SDC vehicles.
  # options: "static", "policy", "replay", "idm"
  non_sdc_controller: policy
  # Controller used by non-vehicle agents. "auto" follows non_sdc_controller unless it is "idm", then it uses "replay".
  # options: "auto", "static", "policy", "replay", "idm"
  non_vehicle_controller: auto
  # Replay-mode agents flagged mark_as_expert are log-replayed (1) or treated like any other agent (0)
  replay_expert_agents: 1
  # Options: "create_all_valid", "create_only_controlled", "create_controllable_types" (uncontrolled ones static)
  init_mode: create_all_valid
  # Enable computation of evaluation-only metrics
  compute_eval_metrics: false
  # Evaluate and render scenarios using the training distribution.
  eval_training_render: false
  # --- Goal / Target ---
  # Goal regeneration policy - options: "finite" (regen full set when all reached), "rolling" (sliding window)
  goal_regen_mode: "finite"
  # How the goal set is seeded - options: "route" (agent forward route), "map" (uniform free-roam)
  goal_source: map
  # Append normalized lane-graph distance to the current goal lane on each lane obs row
  obs_goal_lane_distance: True
  # Meters around goal to be considered "reached"
  goal_radius: 2.0
  # Maximum speed at final waypoint to count goal reward
  goal_speed: 3.0
  # true: goal-speed coef ~ U(0, 20) per agent under reward_randomization; false: pinned to goal_speed (GIGAFLOW v_goal = 3)
  goal_speed_randomization: true
  # true: the final goal is only consumed below goal speed (GIGAFLOW R_goal); false: consumed on entry, reward gated
  goal_reach_requires_speed: false
  # Number of target waypoints in the observation (including goal)
  num_goals: 3
  # Waypoint spacing range in meters when building path
  min_goal_spacing: 20.0
  max_goal_spacing: 200.0
  # Map goal source only: max lane-heading change (deg) between successive waypoints, re-sampling spacing
  # up to GOAL_HEADING_MAX_ATTEMPTS times (GIGAFLOW uses 60). 0 disables.
  goal_heading_max_deg: 60.0
  # --- Rewards ---
  reward_conditioning: true
  reward_randomization: true
  reward_log_sampling: false
  reward_goal: 1.0
  reward_collision: 1.5
  reward_offroad: 1.5
  reward_stop_line: 1.0
  reward_comfort: 0.05
  reward_lane_align: 0.025
  reward_vel_align: 1.0
  reward_lane_center: 0.001
  reward_center_bias: 0.0
  reward_velocity: 0.0025
  reward_reverse: 0.005
  reward_timestep: 2.5e-05
  reward_overspeed: 0.05
  reward_ade: 0.0
  # --- Map ---
  # Path to map used for training
  map_dir: pufferlib/resources/drive/binaries/carla
  # Number of maps to load from map_dir
  num_maps: 8
  # Training fails if num_maps < files in map_dir unless this is set (sorted order would silently pick a subset)
  allow_map_subset: false
  # --- Observation slot counts ---
  obs_slots_lane_n: 70
  obs_slots_boundary_n: 50
  obs_slots_partners_n: 20
  # Append the partner's velocity relative to ego (ego frame, 2 floats) to every partner row (GIGAFLOW observes velocity)
  obs_partner_relative_velocity: false
  obs_slots_traffic_controls_n: 4
  # Fraction of segment observation slots to drop (reduces obs size)
  obs_dropout_lane: 0.5
  obs_dropout_boundary: 0.4
  # Stride for lane and boundary segments; 1 means use every segment, 2 means use every other segment, etc.
  obs_lane_stride: 2
  obs_boundary_stride: 1
  # --- Observation normalization ---
  obs_norm_speed_mps: 60.0
  # num_goals * max_goal_spacing; goals beyond this collapse to a unit direction vector
  obs_norm_goal_offset_m: 600.0
  obs_norm_xy_offset_m: 200.0
  obs_norm_veh_length_m: 10.0
  obs_norm_veh_width_m: 5.0
  obs_norm_road_seg_length_m: 10.0
  obs_norm_road_seg_width_m: 5.0
  obs_norm_z_m: 10.0
  # --- Eval-only ---
  eval_perceived_size_margin_m: 0.1
  # Eval-only: while standing exactly still, |longitudinal jerk| below this (m/s^3) is zeroed
  # so leftover mean-action jerk cannot creep the car. 0 disables.
  eval_standstill_jerk_deadband_mps3: 0.0
  # --- Observation ranges (meters, ego frame) ---
  obs_range_road_front_m: 200.0
  obs_range_road_behind_m: 60.0
  obs_range_road_side_m: 50.0
  obs_range_partner_m: 200.0
  obs_range_traffic_control_m: 200.0
  # --- Robustness features---
  # Erratic agents are selected once per episode; masked out of the PPO rollout buffer.
  # Upper bound of the per-episode blind-agent rate; each episode draws its rate uniformly from [0, this]
  partner_blindness_prob: 0.05
  # Per-step probability that a flagged blind-partner agent zeros out its partner observations
  partner_blindness_trigger_prob: 0.03
  # Duration in seconds of partner blindness once triggered
  partner_blindness_duration_seconds: 3.0
  # Upper bound of the per-episode phantom-braker rate; each episode draws its rate uniformly from [0, this]
  phantom_braking_prob: 0.1
  # Per-step probability that a flagged phantom-braker actually initiates a brake window
  phantom_braking_trigger_prob: 0.03
  # Duration in seconds of phantom braking once triggered
  phantom_braking_duration_seconds: 3.0
  # Zero the steering command while a phantom brake is active (false keeps the policy's steering)
  phantom_braking_freeze_steering: false
policy:
  # Encoder layer (per-encoder embedding width)
  ego_input_size: 128
  partner_input_size: 256
  lane_input_size: 256
  boundary_input_size: 256
  traffic_control_input_size: 128
  context_input_size: 128
  # Encoder activation - options: "relu", "tanh", "gelu"
  encoder_activation: relu
  encoder_layer_norm: true
  mask_padded_features: false
  # Shared backbone layer
  backbone_hidden_size: 1024
  backbone_num_layers: 3
  # Backbone activation - options: "relu", "tanh", "gelu"
  backbone_activation: gelu
  backbone_layer_norm: false
  # Actor head layer
  actor_hidden_size: 256
  actor_num_layers: 1
  actor_head_layer_norm: false
  # Critic head layer
  critic_hidden_size: 256
  critic_num_layers: 1
  critic_head_layer_norm: false
  # Run the actor/critic heads in float32 under bf16 autocast (backbone stays bf16)
  fp32_heads: false
  # Dual or shared actor-critic backbone
  shared_network: false
  action_type: discrete
rnn:
  input_size: 512
  hidden_size: 512
train:
  name: pufferai
  project: ablations
  seed: 42
  # Filename of the final model copy written into train.data_dir when training ends.
  final_model_name: final_model.pt
  # Null disables evaluation during training.
  evaluation_interval_epochs: null
  # Select multiple benchmarks with a comma-separated value. eg: carla_fast,womd_single
  evaluation_benchmarks: carla_fast
  torch_deterministic: false
  cpu_offload: false
  device: cuda
  optimizer: adamw
  anneal_lr: true
  precision: bfloat16
  # false: pure float32 matmuls/convs (no TensorFloat-32); requires precision float32
  tf32: true
  rollout_dtype: float32
  total_timesteps: 500000000000
  learning_rate: 0.0005
  gamma: 0.999
  gae_lambda: 0.95
  update_epochs: 3
  clip_coef: 0.2
  vf_coef: 0.5
  vf_clip_coef: null
  max_grad_norm: 0.5
  separate_grad_clip: true
  normalize_rewards: false
  ent_coef: 0.01
  # Linearly anneal ent_coef to ent_coef_final over the last (1 - start_frac) of training
  ent_coef_anneal: false
  ent_coef_final: 0.001
  ent_coef_anneal_start_frac: 0.75
  # enable value bootstrap to simulate infinite time horizon
  use_value_bootstrapping: true
  # ---
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  adam_weight_decay: 0.01
  data_dir: experiments
  resume_state_path: null
  checkpoint_interval: 50
  # batch_size = num_workers * num_agents *  bptt_horizon
  batch_size: auto
  # Lower bound on the batch size in transitions. Null means no lower bound.
  min_batch_size: null
  minibatch_size: 65536
  # Accumulate gradients above this size
  max_minibatch_size: 65536
  bptt_horizon: 128
  compile: false
  compile_mode: default
  compile_fullgraph: false
  vtrace_rho_clip: 1
  vtrace_c_clip: 1
  adv_sampling_prio_alpha: 0.8499999999999999
  adv_sampling_prio_beta0: 0.8499999999999999
  # Drop transitions whose |advantage| is below adv_filter_threshold_scale * EMA of the batch max
  adv_filter_enabled: true
  adv_filter_ewma_beta: 0.25
  adv_filter_threshold_scale: 0.01
  # Also keep this random fraction of below-threshold transitions; 0 disables the leak
  adv_filter_leak_fraction: 0.0
  # Rendering options
  render: false
  render_interval: 1000
sweep:
  method: Protein
  metric: score
  goal: maximize
  downsample: 10
# Catalog-defined evaluation and replay rendering settings.
eval:
  num_agents: 256
  # Worker cap for replay benchmarks that control only the SDC. Needed for now to limit RAM usage.
  max_sdc_replay_workers: 4
  benchmark_config: pufferlib/config/evaluation/benchmark.yaml
  benchmarks: null
  # Overrides env.map_dir of every selected benchmark; null keeps the benchmark's own map_dir.
  map_dir: null
  # Overrides num_scenarios of every selected benchmark; null keeps the benchmark's own count.
  num_scenarios: null
  # Overrides env.reward_comfort of every selected benchmark; null keeps the benchmark's value.
  reward_comfort: null
  # Overrides env.reward_lane_center of every selected benchmark; null keeps the benchmark's value.
  reward_lane_center: null
  # Overrides env.dt of every selected benchmark, rescaling scenario_length to keep its simulated
  # duration (e.g. 0.0667 = 15 Hz as in Gigaflow's self-play eval); null keeps the benchmark's value.
  dt: null
  # Overrides env.goal_radius of every selected benchmark; null keeps the benchmark's value.
  goal_radius: null
  # Overrides env.base_max_speed_mps of every selected benchmark (20.0 = Gigaflow's eval speed cap,
  # C_vel is fixed to 1 since benchmarks disable reward_randomization); null keeps the benchmark's value.
  base_max_speed_mps: null
  # Overrides env.goal_regen_mode ("finite" or "rolling") of every selected benchmark; null keeps the benchmark's value.
  goal_regen_mode: null
  # Overrides env.goal_source ("route", "map" or "gt") of every selected benchmark; null keeps the benchmark's value.
  goal_source: null
  # Overrides env.goal_speed of every selected benchmark; null keeps the benchmark's value.
  goal_speed: null
  # Override env.min_goal_spacing / env.max_goal_spacing (meters) of every selected benchmark; null keeps the benchmark's value.
  min_goal_spacing: null
  max_goal_spacing: null
  # Overrides env.obs_slots_partners_n of every selected benchmark (e.g. 40 = Gigaflow's up-to-40
  # closest observed agents); slots are max-pooled, so any checkpoint transfers. null keeps the
  # checkpoint's value.
  obs_slots_partners_n: null
  # Overrides env.disable_red_light_infractions of every selected benchmark; null keeps the benchmark's value.
  disable_red_light_infractions: null
  output_name: null
  # Results folder inside the run dir; also names the wandb key prefix final_<output_dir_name>_.
  output_dir_name: eval
  # First global scenario index this process evaluates; used to shard one benchmark across GPUs.
  scenario_offset: 0
  # Fixed results subdir inside the benchmark output dir; null uses a timestamp.
  output_subdir: null
  # Capture and render every scenario during the standard benchmark pass.
  render_scenarios: false
  # Render scenarios where any configured metric is positive.
  # Use all_infractions for every infraction type; null disables it.
  render_filter: null
  # Maximum failures rendered per benchmark; null renders every failure.
  max_rendered_failures: null
  # Existing episode metrics CSV to replay without running the benchmark first.
  failure_replay_csv: null
  capture_observations: false
  observation_replay_wave_size: 16
  observation_replay_writer_count: 4
  # Options: sample | mode | mean
  action_selection: mean
