opengigaflow_planner:
  _target_: opengigaflow.ocean.cosim.nuplan.planner.OpenGigaFlowPlanner
  _convert_: 'all'

  checkpoint_path: ???
  bin_cache_dir: ${oc.env:NUPLAN_EXP_ROOT}/pufferdrive_bin_cache # origin sidecars when the bin's folder is read-only
  city_bin_dir: ??? # whole-city map-only bins nuplan__<map>.bin, the only map source
  device: "cpu"
  map_radius: 400.0 # light-matching radius around the ego start [m]
  goal_spacing: 20.0 # minimum distance between consecutive route roadblock goals [m]
  num_agents: 64 # shadow agent pool: the ego + streamed partners
  horizon_seconds: 8.0 # nuplan default
  # The settings behind our Val14 scores follow. sliding_goal_window: refill the window after every consumed goal.
  sliding_goal_window: true
  # jerk caps [m/s^3, 0 = off] for the first startup_jerk_cap_seconds: nuPlan's ego_lon_jerk extrapolates at t=0
  startup_jerk_cap_seconds: 1.5
  startup_accel_jerk_cap_mps3: 2.0
  startup_brake_jerk_cap_mps3: 2.0
  # eval hack: grow pedestrian and bicycle partner boxes by this much [m] in length and width in the policy's obs; 0 = off
  vru_size_pad_m: 0.8
  # speed floor of the ego plant (nuPlan's KinematicBicycleModel) [m/s]: 0 = CaRL's no-reverse driving, -2 = Drive's
  bicycle_min_speed_mps: 0.0
  # CaRL's clip_angular_adjustment: reduce the plant's accel while turning to keep nuPlan's center accel under the cap
  bicycle_center_accel_cap: true
  bicycle_center_accel_cap_margin: 0.95 # factor on the ego accel cap for the center cap (savgol overshoot headroom)
  env_overrides:
    obs_slots_partners_n: 40 # GIGAFLOW eval value (Table A4); slots are max-pooled, so any checkpoint transfers
    stop_signs_enabled: false # nuPlan city bins export TURN_STOP zones as stop signs; keep them out of the obs
    # observed lane widths [m] clipped to the CARLA training range (nuPlan lanes reach 50 m); max 0 = off
    obs_lane_width_clip_min_m: 2.85
    obs_lane_width_clip_max_m: 4.4
  obs_html_dir: null # per-scenario opengigaflow.viz observation replay
  obs_html_max_steps: 800
  obs_html_render: true  # false: save .replay.zlib only, render later (scripts/eval/render_obs_html.py)
