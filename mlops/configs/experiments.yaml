# PufferDrive Experiments Configuration
# ======================================
#
# Define experiments and runs to execute on GCP Vertex AI.
#
# Structure:
#   experiments:
#     - name: experiment_name       # Group name for related runs
#       machine: T4                 # Default machine for all runs (optional)
#       dataset_path: gs://...      # Default dataset for all runs (optional)
#       params: {...}               # Default params inherited by all runs (optional)
#       param.key: value            # Flat params also supported at experiment level
#       runs:                       # List of individual runs
#         - name: run_name          # Unique name within the experiment
#           machine: L4             # Override machine for this run (optional)
#           params: {...}           # Additional/override params (optional)
#
# If no 'runs' are specified, the experiment itself becomes a single run.
#
# Output structure in bucket:
#   gs://bucket/experiments/<experiment_name>/<run_name>/
#
# Usage:
#   python mlops/mlops.py launch-batch mlops/experiments.yaml


experiments:
  - name: miniflow
    machine: RTX6000
    params:
      # Vec
      vec.num-envs: 24
      # Policy
      policy.input-size: 128
      policy.dropout: 0.2
      # Env
      env.num-agents: 2048
      env.reward-conditioning: False
      env.reward-randomization: False
      env.max-agents-per-env: 120
      env.num-maps: 8
      # Train
      train.total-timesteps: 300_000_000_000
      train.checkpoint-interval: 500
      train.optimizer: adamw
      train.minibatch-size: 65_536 # 65_536, 131_072, 262_144
      train.max-minibatch-size: 65_536
    runs:
      - name: base
