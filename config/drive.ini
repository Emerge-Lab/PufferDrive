[base]
env_name = drive

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
dt = 0.1
init_step = 0
dynamics_model = 0
action_type = 0
episode_length = 91
reward_collision = -0.2
reward_offroad = -0.2
reward_goal_post_respawn = 0
reward_collision_post_respawn = 0
collision_behavior = 0
offroad_behavior = 0
resample_frequency = 10000
num_maps = 400

[policy]
shared_encoder = True
shared_trunk = True
; Encoder specifications
ego_hidden_size = 64
ego_num_layers = 2
partner_hidden_size = 128
partner_num_layers = 2
lane_hidden_size = 128
lane_num_layers = 2
boundary_hidden_size = 128
boundary_num_layers = 2
tc_hidden_size = 256
tc_num_layers = 1
cond_hidden_size = 256
cond_num_layers = 1
dropout = 0.0
mask_padded_observations = False
encoder_activation = tanh
; Trunk specifications
trunk_type = MinGRU
trunk_hidden_size = 256
trunk_num_layers = 4
trunk_activation = gelu
; Actor specifications
actor_hidden_size = 256
actor_num_layers = 0
actor_activation = gelu
; Critic specifications
critic_hidden_size = 256
critic_num_layers = 0
critic_activation = gelu

[train]
gpus = 1
seed = 42
total_timesteps = 1667760009
optimizer = adamw
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 8192
horizon = 128
vtrace_rho_clip = 1
vtrace_c_clip = 1
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 1e9
scale = auto

[sweep.env.reward_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

[sweep.env.reward_offroad]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

[sweep.env.reward_goal_post_respawn]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto
