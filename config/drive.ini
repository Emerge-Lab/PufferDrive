[base]
env_name = drive

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 2

[env]
; Options: [0] gigaflow - [1] replay
simulation_mode = 1
; Actions type - options: [0] discrete - [1] continuous
action_type = 0
; Dynamics model - options: [0] classic - [1] jerk
dynamics_model = 1
; Time delta between steps in seconds
dt = 0.1
; Step of the trajectory to initialize the agents in data-driven scenario
init_step = 0
; Number of steps before reset
episode_length = 91
; Frequency of resampling scenario (in steps), 0 to disable
resample_frequency = 0
; Collision behavior - options: [0] ignore - [1] stop - [2] remove
collision_behavior = 1
; Offroad behavior - options: [0] ignore - [1] stop - [2] remove
offroad_behavior = 1
; Red light violation behavior - options: [0] ignore - [1] stop - [2] remove
red_light_behavior = 1
; End of episode - options: [0] episode_length - [1] early reset when too many agents are removed
termination_mode = 0
; Options: [0] - control all agents [1] - control only ego
control_mode = 0
; Options: [0] traffic lights, [1] traffic lights & stop signs, [2] all traffic controls
traffic_control_scope = 0
; Eval mode disables training-time randomization in spawn dimensions and traffic-light schedules
eval_mode = 0
; Replay mode: move controlled agents from logged expert trajectories
replay_expert_actions = 0
; Ratio of inactive agents (stopped/removed) that triggers early reset (used when termination_mode = 1)
inactive_agent_threshold = 0.4
; --- GIGAFLOW-specific---
; Minimum/maximum number of agents per environment
min_agents_per_env = 1
max_agents_per_env = 10
; Optional nonzero launch speed for gigaflow random spawns
spawn_initial_speed = 0.0
; --- Goal / Target ---
; Target representation - options: [0] static - [1] dynamic
target_type = 0
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Maximum speed at final waypoint to count goal reward
goal_speed = 1000.0
; Number of observed target waypoints (static goals or rolling dynamic waypoints)
num_target_waypoints = 3
; Static goal spacing range in meters. Sampled on the path_spacing lattice.
min_goal_spacing = 10.0
max_goal_spacing = 10.0
; Path interpolation spacing in meters. Dynamic waypoint distance uses this value.
path_spacing = 2.0
; --- Map config ---
map_binary_dir = resources/drive/binaries/womd
num_maps = 400
; --- Reward coefficients ---
reward_goal = 1.0
reward_collision = 1.0
reward_offroad = 1.0
reward_stop_line = 1.0
reward_comfort = 0.0
reward_lane_align = 0.025
reward_vel_align = 1.0
reward_lane_center = 0.05
reward_center_bias = 0.0
reward_velocity = 0.1
reward_reverse = 0.0
reward_timestep = 0.0
reward_overspeed = 0.0
; --- Observation slot counts ---
obs_slots_lane = 40
obs_slots_boundary = 40
obs_slots_partners = 16
obs_slots_traffic_controls = 4
; --- Observation normalization (meters) ---
norm_goal_offset_m = 100.0
norm_xy_offset_m = 100.0
norm_vehicle_length_m = 15.0
norm_vehicle_width_m = 5.0
norm_road_segment_length_m = 10.0
norm_road_segment_width_m = 5.0
; --- Observation ranges (meters, ego frame) ---
obs_range_road_front_m = 100.0
obs_range_road_behind_m = 20.0
obs_range_road_side_m = 30.0
obs_range_partner_m = 100.0
obs_range_traffic_control_m = 100.0

[policy]
shared_encoder = True
shared_trunk = True
; Encoder specifications
ego_hidden_size = 64
ego_num_layers = 1
target_hidden_size = 64
target_num_layers = 1
partner_hidden_size = 128
partner_num_layers = 1
lane_hidden_size = 128
lane_num_layers = 1
boundary_hidden_size = 128
boundary_num_layers = 1
tc_hidden_size = 128
tc_num_layers = 1
dropout = 0.0
mask_padded_observations = False
encoder_activation = tanh
; Trunk specifications
trunk_type = MLP
trunk_hidden_size = 256
trunk_num_layers = 2
trunk_activation = gelu
; Actor specifications
actor_hidden_size = 256
actor_num_layers = 0
actor_activation = gelu
; Critic specifications
critic_hidden_size = 256
critic_num_layers = 0
critic_activation = gelu

[train]
gpus = 1
seed = 42
total_timesteps = 1_000_000_000
; Optimizer
optimizer = adamw
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
; PPO-specific
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
minibatch_size = 8192
horizon = 128
vtrace_rho_clip = 1
vtrace_c_clip = 1
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 1e9
scale = auto

[sweep.env.reward_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

[sweep.env.reward_offroad]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto
