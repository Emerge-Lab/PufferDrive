# Replay / control_sdc_only training config.
# All keys here override the stock drive.ini on the cluster.
# SCP this file and launch with:
#
#   python scripts/submit_cluster.py \
#       --save_dir /scratch/$USER/runs \
#       --compute_config scripts/cluster_configs/nyu_greene.yaml \
#       --program_config scripts/cluster_configs/replay_sdc.yaml \
#       --wandb-project <YOUR_WANDB_PROJECT> \
#       --container --heartbeat \
#       --account <ACCOUNT> --partition <PARTITION> --time 720 \
#       --args "train.seed=0:1:2"


# Environment
env.simulation_mode: replay
env.control_mode: control_sdc_only
env.num_agents: 10
env.use_map_cache: 0
env.scenario_length: 200
env.map_dir: /scratch/rs10105/data/nuplan
env.num_maps: 1000

# Vec
vec.num_envs: 16

# Training
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 1000
train.minibatch_size: 8192

# Disable nuPlan-based evaluators. validation_gigaflow stays on but is
# reconfigured to triage_html (CPU-only scene playback + per-episode metrics
# including dnf_rate), pinned to the same Town10HD single-agent setup the
# training uses, so each eval cycle drops a gallery of rollouts you can browse
# for DNFs. The eight-way ffmpeg/EGL spike of the default egl backend is gone.

eval.validation_replay.enabled: 0
eval.validation_gigaflow.enabled: 0
eval.behaviors_full_dir.enabled: 0
eval.behaviors_hard_stop.enabled: 0
eval.behaviors_highway_straight.enabled: 0
eval.behaviors_lane_change.enabled: 0
eval.behaviors_merge.enabled: 0
eval.behaviors_parked_cars.enabled: 0
eval.behaviors_roundabout.enabled: 0
eval.behaviors_stopped_traffic.enabled: 0
eval.behaviors_traffic_light_green.enabled: 0
eval.behaviors_traffic_light_stop.enabled: 0
eval.behaviors_unprotected_left.enabled: 0
eval.behaviors_unprotected_right.enabled: 0

eval.validation_gigaflow.render_backend: obs_html
eval.validation_gigaflow.env.map_dir: pufferlib/resources/drive/binaries/carla/opendrive__Town10HD.bin
eval.validation_gigaflow.env.num_maps: 1
eval.validation_gigaflow.env.num_agents: 64
eval.validation_gigaflow.env.min_agents_per_env: 1
eval.validation_gigaflow.env.max_agents_per_env: 1
eval.behaviors_full_dir.enabled: 0
eval.behaviors_hard_stop.enabled: 0
eval.behaviors_highway_straight.enabled: 0
eval.behaviors_lane_change.enabled: 0
eval.behaviors_merge.enabled: 0
eval.behaviors_parked_cars.enabled: 0
eval.behaviors_roundabout.enabled: 0
eval.behaviors_stopped_traffic.enabled: 0
eval.behaviors_traffic_light_green.enabled: 0
eval.behaviors_traffic_light_stop.enabled: 0
eval.behaviors_unprotected_left.enabled: 0
eval.behaviors_unprotected_right.enabled: 0

# W&B
wandb: True
wandb_project: nuplan-test-training-ricky
wandb_group: cluster
