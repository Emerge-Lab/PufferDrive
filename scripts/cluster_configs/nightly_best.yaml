# Multi-agent "best launch" nightly training program config.
#
# The training recipe (env scale, goals, observations, perturbations, rewards,
# policy architecture, optimizer settings) is the mimolette recipe, which is
# the default in pufferlib/config/puffer_drive.yaml. This file only overrides
# run-scale and logging for a night-sized run.
#
# Launch via scripts/launch_nightly_best.sh (3 seeds, date-stamped).

# Mimolette scale. The defaults keep the recipe (env physics, goals, obs,
# rewards, policy) but are sized to run on-premise for dev; the scale knobs
# for a real training run live here.
env.num_agents: 3200
vec.num_envs: 40
train.minibatch_size: 256000
train.max_minibatch_size: 64000
train.compile: true

# Night-sized run: mimolette's full schedule doesn't finish overnight.
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 500

# validation_gigaflow (CARLA sweep) runs inline; validation_replay needs
# nuPlan bins not used in this nightly.
eval.validation_replay.enabled: 0

# W&B — group has no space (submit_cluster.py joins the inner command
# without quoting arg values). Launchers (launch_nightly_best.sh and
# Modal's nightly()) override wandb_group to today's date at launch so
# runs cluster by night in the UI; the static value here is just the
# fallback for ad-hoc invocations.
wandb: True
wandb_project: nightly-multi
wandb_group: nightly-multi
