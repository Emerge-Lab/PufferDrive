# Multi-agent "best launch" nightly training program config.
#
# The training recipe (env physics, goals, observations, perturbations,
# rewards, policy architecture, optimizer settings) comes from the defaults
# in pufferlib/config/puffer_drive.yaml. This file only overrides scale,
# run length, and logging.
#
# Launch via scripts/launch_nightly_best.sh (3 seeds, date-stamped).

# Full training scale. The defaults are sized to run on-premise for dev;
# the scale knobs for a real training run live here.
policy.action_type: discrete
env.num_agents: 3200
vec.num_envs: 40
train.minibatch_size: 256000
train.max_minibatch_size: 64000
train.compile: true

# Night-sized run: the default 500B-step schedule doesn't finish overnight.
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 500

# Run the catalog-defined fast CARLA evaluation every 100 training epochs.
train.evaluation_interval_epochs: 100
train.evaluation_benchmarks: carla_fast

# W&B — group has no space (submit_cluster.py joins the inner command
# without quoting arg values). Launchers (launch_nightly_best.sh and
# Modal's nightly()) override wandb_group to today's date at launch so
# runs cluster by night in the UI; the static value here is just the
# fallback for ad-hoc invocations.
wandb: True
wandb_project: nightly-multi
wandb_group: nightly-multi
