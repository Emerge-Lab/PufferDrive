# Multi-agent nightly program config (scripts/launch_nightly_best.sh): opengigaflow.yaml's recipe, scale and length here.

# full training scale on one GPU (the defaults are sized for an 8-GPU node)
policy.action_type: discrete
env.num_agents: 3200
vec.num_envs: 40
train.minibatch_size: 256000
train.max_minibatch_size: 64000
train.compile: true

# night-sized: the default 1e12-step schedule does not finish overnight
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 500

# no spaces: submit_cluster.py joins the command unquoted; the launcher replaces the group with the date
wandb: True
wandb_project: nightly-multi
wandb_group: nightly-multi
