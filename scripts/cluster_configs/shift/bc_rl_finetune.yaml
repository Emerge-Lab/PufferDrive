# BC+RL fine-tune arm: SHIFT without the KL anchor. Warm-starts from the self-play base and
# fine-tunes on log replay with every self-play reward plus the expert-similarity reward, with
# train.kl_ref_coef=0. Identical to SHIFT at step zero, so the comparison isolates the KL term.
# Not in the paper's Table A3 (its BC+RL arm, bc_rl.yaml, starts from scratch).
#
# Required on the command line:
#   load_model_path=<self-play base .pt>   env.map_dir=<replay .bin logs>   env.num_maps=<count>
# Keep everything below identical to shift.yaml except the KL coefficient.

# Agents-on-rails: ego on the policy, every other agent replays its log.
env.simulation_mode: replay
env.control_mode: control_sdc_only
env.sdc_controller: policy
env.non_sdc_controller: replay
env.non_vehicle_controller: replay
env.goal_source: gt
env.init_mode: create_all_valid
# Dynamics must match the retrained self-play base (rear-axle slip on).
env.jerk_rear_axle_slip: true
env.max_agents_per_env: 1
# One ego per env; replay logs load heavier than CARLA towns, keep this modest.
env.num_agents: 128
env.init_step: 0
# Replay logs are 10 Hz: dt must match; the paper's 6.6 s sub-episodes and 2.7 s start offsets are 66 and 27 steps.
env.dt: 0.1

# Short sub-episodes with a random start offset inside each log (steps at the sim dt).
env.episode_max_steps: 66
env.init_step_jitter_steps: 27
env.static_expert_min_motion_m: 1.0
env.offroad_expert_linter: true

# Rewards: all self-play terms stay on, fixed conditioning vector, plus the
# quadratic expert-similarity term.
env.reward_expert_similarity: 0.01
env.reward_conditioning: true
env.reward_randomization: false
env.goal_radius: 10.0
env.reward_collision: 3.0
env.reward_offroad: 3.0
env.reward_comfort: 0.05
env.reward_lane_align: 0.25
env.reward_vel_align: 1.0
env.reward_lane_center: 0.025
env.reward_center_bias: 0.0
env.reward_reverse: 0.005
env.reward_stop_line: 1.0
env.reward_overspeed: 1.0
env.reward_velocity: 0.005

# Behavioral perturbations off: partners are replayed, not learned.
env.phantom_braking_prob: 0
env.partner_blindness_prob: 0

# Training: KL anchor to the loaded checkpoint, lower learning rate, short schedule.
train.kl_ref_coef: 0.0
train.learning_rate: 0.0001
# Paper: 1,501 cycles of ~100K transitions.
train.total_timesteps: 150_000_000
train.checkpoint_interval: 100
train.compile: true
train.evaluation_interval_epochs: 100
train.evaluation_benchmarks: nuplan_single

wandb: True
wandb_project: shift-experiments
wandb_group: bc_rl_finetune
