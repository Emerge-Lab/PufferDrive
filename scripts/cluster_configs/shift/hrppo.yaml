# HR-PPO arm ("Human-like autonomy emerges from self-play and a pinch of human
# data"): self-play from scratch with sparse rewards, anchored to a supervised
# BC policy through the reverse KL D_KL(pi_bc || pi) added to the PPO loss.
#
# Required on the command line:
#   train.kl_ref_model_path=<models/model_puffer_drive_bc.pt from shift/hrppo_anchor_bc.yaml>
# The policy block must match hrppo_anchor_bc.yaml so the anchor's weights load.

policy.action_type: discrete
# Dynamics must match the BC anchor (rear-axle slip on).
env.jerk_rear_axle_slip: true
env.num_agents: 3200
vec.num_envs: 40
train.minibatch_size: 256000
train.max_minibatch_size: 64000
train.compile: true

# Sparse rewards: +1 goal, -1 collision, -1 off-road, nothing else. The sim adds
# a speed-scaled term to the collision penalty; that is the only shaping left on.
env.reward_conditioning: false
env.reward_randomization: false
env.goal_radius: 2.0
env.reward_goal: 1.0
env.reward_collision: 1.0
env.reward_offroad: 1.0
env.reward_stop_line: 0.0
env.reward_comfort: 0.0
env.reward_lane_align: 0.0
env.reward_vel_align: 0.0
env.reward_lane_center: 0.0
env.reward_center_bias: 0.0
env.reward_velocity: 0.0
env.reward_reverse: 0.0
env.reward_timestep: 0.0
env.reward_overspeed: 0.0
env.phantom_braking_prob: 0
env.partner_blindness_prob: 0

# KL anchor toward the BC policy, paper value lambda = 0.075.
train.kl_ref_coef: 0.075
train.kl_ref_direction: reference_to_policy
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 500
train.evaluation_interval_epochs: 100
train.evaluation_benchmarks: nuplan_single

wandb: True
wandb_project: shift-experiments
wandb_group: hrppo
