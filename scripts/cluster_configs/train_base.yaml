# Base program config for submit_cluster.py: key=value overrides of opengigaflow/config/opengigaflow.yaml (maps and agent
# counts stay the defaults).

# single-GPU scale (the defaults are sized for an 8-GPU node)
vec.num_envs: 20
train.minibatch_size: 65536
train.max_minibatch_size: 65536
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 1000

wandb: True
wandb_project: opengigaflow
wandb_group: cluster
