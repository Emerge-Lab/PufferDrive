# Base training configuration for PufferDrive cluster jobs (turbostream).
# These args are passed to `puffer train puffer_drive` as --key=value flags.
#
# Only keys listed here override the defaults in pufferlib/config/ocean/drive.ini.
# Vec settings (num_envs, num_workers, batch_size), env.map_dir, env.num_maps,
# and env.num_agents are all intentionally omitted so runs inherit the ini.

# Training
train.total_timesteps: 10_000_000_000
train.checkpoint_interval: 1000

# W&B logging
wandb: True
wandb_project: pufferdrive
wandb_group: cluster
