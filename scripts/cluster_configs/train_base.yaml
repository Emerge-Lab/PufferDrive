# Base training configuration for PufferDrive cluster jobs
# These args are passed to `puffer train puffer_drive`

# Vectorization
vec.num_workers: 16
vec.num_envs: 16

# Environment
env.num_agents: 1024
env.map_dir: "pufferlib/resources/drive/binaries/carla"
env.num_maps: 8

# Training
train.total_timesteps: 2_000_000_000
train.checkpoint_interval: 1000

# Rendering
train.render: True

# W&B logging
wandb: True
wandb_project: pufferdrive
wandb_group: cluster
