# Base training configuration for PufferDrive cluster jobs
# These args are passed to `puffer train puffer_drive`

# Vectorization
vec.num_workers: 16
vec.num_envs: 16

# Environment
env.num_agents: 1024
env.map_dir: "resources/drive/binaries/training"
env.num_maps: 10000

# Training
train.total_timesteps: 2_000_000_000
train.learning_rate: 0.003
train.batch_size: 524288
train.minibatch_size: 32768
train.bptt_horizon: 32
train.gamma: 0.98
train.gae_lambda: 0.95
train.ent_coef: 0.005
train.checkpoint_interval: 1000

# Rendering (disable for headless cluster)
train.render: False

# W&B logging
wandb: True
wandb-project: pufferdrive
wandb-group: cluster
